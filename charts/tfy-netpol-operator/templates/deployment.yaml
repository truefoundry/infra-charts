apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tfy-netpol-operator.fullname" . }}
  labels:
    {{- include "tfy-netpol-operator.labels" . | nindent 4 }}
spec:
  # Single active replica; the operator runs with --standalone (no peering).
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tfy-netpol-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tfy-netpol-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tfy-netpol-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CONFIG_PATH
              value: /etc/tfy-netpol-operator/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/tfy-netpol-operator
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tfy-netpol-operator.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
