global:
  tenantName: ""
  # Vector is on, so global.controlPlaneURL must be non-empty or helm template aborts
  controlPlaneURL: "http://control-plane.invalid"
  customCA:
    enabled: true
    existingConfigMap:
      name: tfy-llm-gateway-custom-ca
      overrideCAList: false
proxy:
  tls:
    enabled: true
    secretName: tfy-llm-gateway-proxy-tls

redis:
  enabled: true

vector:
  enabled: true
