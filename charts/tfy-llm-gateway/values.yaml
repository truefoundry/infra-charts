## @section Configuration for LLM Gateway
global:
  ## @param global.resourceTier Resource deployment type
  resourceTier: "medium"
  ## @param global.controlPlaneURL Control plane URL
  controlPlaneURL: ""
  ## @param global.controlPlaneChartVersion Control plane version
  controlPlaneChartVersion: "0.98.2"
  ## @param global.gatewayChartVersion Gateway version
  gatewayChartVersion: "0.180.3"
  ## global.multitenant Multitenant configuration
  multitenant:
    ## @param global.multitenant.enabled Enable multitenant env injection
    enabled: false
  ## @param global.imagePullSecrets [array] Existing truefoundry image pull secret name
  imagePullSecrets: []
  ## @param global.affinity [object] Affinity rules for pod scheduling on a node
  affinity: {}
  ## @param global.labels [object] Global labels
  labels: {}
  ## @param global.annotations [object] Global annotations
  annotations: {}
  ## @param global.podLabels [object] Global pod labels
  podLabels: {}
  ## @param global.podAnnotations [object] Global pod annotations
  podAnnotations: {}
  ## @param global.deploymentLabels [object] Global deployment labels
  deploymentLabels: {}
  ## @param global.deploymentAnnotations [object] Global deployment annotations
  deploymentAnnotations: {}
  ## @param global.serviceAnnotations [object] Global service annotations
  serviceAnnotations: {}
  ## @param global.serviceLabels [object] Global service labels
  serviceLabels: {}
  ## @param global.tolerations [array] Tolerations for pod scheduling on a node
  tolerations: []
  ## @param global.nodeSelector [object] Node selector
  nodeSelector: {}
  ## global.serviceAccount Service account configuration
  serviceAccount:
    ## @param global.serviceAccount.name Service account name
    name: ""
    ## @param global.serviceAccount.labels Service account labels
    labels: {}
    ## @param global.serviceAccount.annotations Service account annotations
    annotations: {}
  ## @param global.image.registry Global image registry override
  image:
    registry: "tfy.jfrog.io"
  ## @param global.namespaceOverride Namespace override (defaults to .Release.Namespace if not set)
  namespaceOverride: ""
  ## global.wif Workload Identity Federation (WIF) RBAC settings.
  wif:
    ## @param global.wif.enabled Bool to create Role + RoleBinding(s) granting llm-gateway service account permission to create ServiceAccount tokens (TokenRequest API) for Workload Identity Federation.
    enabled: false
  ## global.podSecurityContext Pod security context defaults for every component. A component's own
  ## podSecurityContext overrides single fields. Under the truefoundry chart, its global.podSecurityContext applies.
  podSecurityContext:
    ## @param global.podSecurityContext.enabled Apply pod security contexts. Set to false to turn them off for all components; a component can set its own `enabled`.
    enabled: true
    ## @param global.podSecurityContext.runAsNonRoot Default runAsNonRoot for component pods
    runAsNonRoot: true
    ## @param global.podSecurityContext.runAsUser Default user ID for component pods
    runAsUser: 1001
    seccompProfile:
      ## @param global.podSecurityContext.seccompProfile.type Default seccomp profile for component pods
      type: RuntimeDefault
  ## global.containerSecurityContext Container security context defaults for every component. A component's own
  ## securityContext overrides single fields. Under the truefoundry chart, its global.containerSecurityContext applies.
  containerSecurityContext:
    ## @param global.containerSecurityContext.enabled Apply container security contexts. Set to false to turn them off for all components; a component can set its own `enabled`.
    enabled: true
    ## @param global.containerSecurityContext.readOnlyRootFilesystem Default readOnlyRootFilesystem for component containers
    readOnlyRootFilesystem: true
    ## @param global.containerSecurityContext.allowPrivilegeEscalation Default allowPrivilegeEscalation for component containers
    allowPrivilegeEscalation: false
    capabilities:
      ## @param global.containerSecurityContext.capabilities.drop [array] Linux capabilities dropped from component containers
      drop:
        - ALL
  ## global.customCA Custom CA certificate configuration
  customCA:
    ## @param global.customCA.enabled Bool to enable custom CA certificate injection
    enabled: false
    ## @param global.customCA.certificate PEM-encoded CA certificate to trust (paste the full certificate content here). Uses an initContainer to merge with system CAs.
    certificate: ""
    ## global.customCA.existingConfigMap Reference an existing ConfigMap containing CA certificate(s) under key "ca-certificates.crt"
    existingConfigMap:
      ## @param global.customCA.existingConfigMap.name Name of the existing ConfigMap
      name: ""
      ## @param global.customCA.existingConfigMap.overrideCAList When true, mounts ConfigMap directly at /etc/ssl/certs/ replacing the system CA bundle (no initContainer). The ConfigMap must contain the full CA bundle (system + custom CAs). When false, an initContainer merges the custom CA with system CAs.
      overrideCAList: false
    ## @param global.customCA.env [object] Additional environment variables to inject into the custom CA initContainer when customCA is enabled.
    env: {}
    # Example:
    # env:
    #   SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    #   REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    ## global.customCA.emptyDir EmptyDir configuration for volumes used in custom CA injection
    emptyDir:
      sslCerts:
        ## @param global.customCA.emptyDir.sslCerts.sizeLimit Size limit for the ssl-certs emptyDir volume
        sizeLimit: ""
    ## @param global.customCA.securityContext [object] Security context for the custom CA initContainer.
    securityContext:
      ## Enable/disable this to override the global.containerSecurityContext
      # enabled: true
      runAsGroup: 1001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    ## global.customCA.image Image configuration for the initContainer that processes CA certificates (not used when overrideCAList is true)
    image:
      ## @param global.customCA.image.registry Registry override for the CA certificates initContainer image (defaults to global.image.registry)
      registry: ""
      ## @param global.customCA.image.repository Repository for the CA certificates initContainer image
      repository: "tfy-mirror/alpine"
      ## @param global.customCA.image.tag Tag for the CA certificates initContainer image
      tag: "3.21"
  ## global.mTLS mTLS certificate mounted into the gateway pod. When installed under the
  ## truefoundry umbrella chart this is overridden by the parent's global.mTLS (the bootstrap
  ## job there issues the certificate). Set enabled here only when installing this chart
  ## standalone and supplying the certificate secret via externalMtlsSecret.
  mTLS:
    ## @param global.mTLS.enabled Bool to mount the mTLS certificate into the gateway and serve/probe over HTTPS
    enabled: false
    ## @param global.mTLS.tlsSecretName Secret (mounted at /etc/tls/truefoundry) holding ca.crt + tls.key + tls.crt
    tlsSecretName: "truefoundry-internal-tls"
    ## @param global.mTLS.externalMtlsSecret Use an existing secret with this name instead of the bootstrap-created one. Required when installing this chart standalone with mTLS enabled.
    ## The secret is expected to contain the following keys, mounted at /etc/tls/truefoundry:
    ##   tls.crt  - the leaf certificate (PEM)
    ##   tls.key  - the leaf private key (PEM)
    ##   ca.crt   - the CA certificate used to verify peers (PEM)
    externalMtlsSecret: ""
