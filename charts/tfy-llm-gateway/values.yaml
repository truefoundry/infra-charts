  annotations: {}
  ## @param httpRoute.labels HTTPRoute labels
  labels: {}
  ## @param httpRoute.parentRefs [array] Parent gateway references for the HTTPRoute
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  ## @param httpRoute.hostnames [array] Hostnames for the HTTPRoute
  hostnames: []
  #  - "llm-gateway.example.com"
  ## httpRoute.timeouts Timeouts applied to the HTTPRoute rule (Gateway API HTTPRouteTimeouts). Enforcement depends on the Gateway implementation.
  timeouts:
