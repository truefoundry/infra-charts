{{- if eq (include "tfy-llm-gateway.bootstrap.enabled" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfy-llm-gateway.bootstrap.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "tfy-llm-gateway.bootstrap.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-llm-gateway.bootstrap.commonAnnotations" . | nindent 4 }}
stringData:
  tfy-llm-gateway-bootstrap.sh: |
    #!/bin/sh
    # Issues and renews the mTLS certificate the gateway mounts at
    # /etc/tls/truefoundry. Mirrors the truefoundry chart's bootstrap job, for installations
    # of this chart on its own.
    set -eu

    WORKDIR="/tmp/workdir"
    TLS_SECRET="{{ include "tfy-llm-gateway.bootstrap.tlsSecretName" . }}"
    CA_SECRET="{{ include "tfy-llm-gateway.bootstrap.caSecretName" . }}"
    CA_DAYS="{{ .Values.global.mTLS.caDays | default 3650 }}"
    LEAF_DAYS="{{ .Values.global.mTLS.leafDays | default 1095 }}"
    RENEW_BEFORE_DAYS="{{ .Values.global.mTLS.renewBeforeDays | default 180 }}"
    FORCE_RENEW="{{ .Values.global.mTLS.forceRenew | default false }}"

    print_green() {
        echo "[bootstrap] $1"
    }
    print_yellow() {
        echo "[bootstrap] $1"
    }
    print_red() {
        echo "[bootstrap] ERROR: $1" >&2
    }

    NS="${TRUEFOUNDRY_NAMESPACE:-}"
    if [ -z "$NS" ]; then
        print_red "TRUEFOUNDRY_NAMESPACE is not set."
        exit 1
    fi

    if ! command -v openssl >/dev/null; then
        print_red "Missing OpenSSL"
        exit 1
    fi

    WORK="$WORKDIR/.mtls"
    rm -rf "$WORK"
    mkdir -p "$WORK"
    cd "$WORK"

    # --- Root CA: kept in its own secret ($CA_SECRET) holding ca.crt + ca.key.
    # The CA private key lives ONLY here (read by this job for signing/renewal) and is
    # never placed in the mounted leaf secret. Recovers the CA from $CA_SECRET so renewals
    # re-sign with the same CA; otherwise generates a fresh CA. A newly generated CA is
    # NOT written until make_leaf succeeds — otherwise a retry would reuse the CA secret,
    # see a still-valid old leaf, take the "nothing to do" path, and never strip ca.key
    # from the mounted TLS secret or sign a leaf with the new CA until natural expiry.
    ensure_ca() {
      if kubectl -n "$NS" get secret "$CA_SECRET" -o jsonpath='{.data.ca\.key}' 2>/dev/null | base64 -d > ca.key 2>/dev/null && [ -s ca.key ]; then
        kubectl -n "$NS" get secret "$CA_SECRET" -o jsonpath='{.data.ca\.crt}' | base64 -d > ca.crt
        print_green "Reusing existing CA from secret '$CA_SECRET'."
        return 0
      fi
      if kubectl -n "$NS" get secret "$TLS_SECRET" -o jsonpath='{.data.ca\.key}' 2>/dev/null | base64 -d > ca.key 2>/dev/null && [ -s ca.key ]; then
        kubectl -n "$NS" get secret "$TLS_SECRET" -o jsonpath='{.data.ca\.crt}' | base64 -d > ca.crt
        print_yellow "Recovered CA from '$TLS_SECRET'; will move it to '$CA_SECRET' after the leaf is issued."
        return 0
      fi
      print_yellow "Creating root CA valid for ${CA_DAYS} days."
      openssl genrsa -out ca.key 4096
      openssl req -x509 -new -nodes -sha256 -days "$CA_DAYS" \
        -key ca.key -out ca.crt \
        -subj "/O=TrueFoundry/CN=TrueFoundry Internal Root CA" \
        -addext "basicConstraints=critical,CA:TRUE" \
        -addext "keyUsage=critical,keyCertSign,cRLSign"
    }

    persist_ca() {
      kubectl -n "$NS" create secret generic "$CA_SECRET" \
        --from-file=ca.crt=ca.crt --from-file=ca.key=ca.key \
        --dry-run=client -o yaml | kubectl apply -f -
      print_green "CA secret '$CA_SECRET' created/updated."
    }

    # --- Should we (re)issue the leaf? ---------------------------------------
    fetch_current_leaf() {
      kubectl -n "$NS" get secret "$TLS_SECRET" -o jsonpath='{.data.tls\.crt}' 2>/dev/null | base64 -d > current.crt 2>/dev/null || rm -f current.crt
    }

    leaf_needs_renewal() {
      # true if the leaf is missing OR it expires within RENEW_BEFORE_DAYS.
      [ -s current.crt ] || return 0
      threshold=$((RENEW_BEFORE_DAYS * 24 * 3600))
      if openssl x509 -checkend "$threshold" -noout -in current.crt >/dev/null 2>&1; then
        return 1   # still valid beyond the threshold
      fi
      return 0
    }

    leaf_signed_by_ca() {
      [ -s current.crt ] || return 1
      openssl verify -CAfile ca.crt current.crt >/dev/null 2>&1
    }

    tls_secret_has_ca_key() {
      key="$(kubectl -n "$NS" get secret "$TLS_SECRET" -o jsonpath='{.data.ca\.key}' 2>/dev/null || true)"
      [ -n "$key" ]
    }

    # true if the current leaf lacks any SAN the chart now expects (e.g. a renamed release or a
    # new global.mTLS.extraDnsNames entry), so a SAN change reissues it.
    # Reads the SANs with tr and grep only: the bootstrap image ships no sed, and a silent
    # failure to read them is indistinguishable from "every SAN is missing", which would
    # reissue the leaf on every run and make renewBeforeDays meaningless. Compares the
    # "DNS:<name>" lines as grep -o emits them, so no field splitting is needed either.
    leaf_missing_sans() {
      [ -s current.crt ] || return 0
      if ! openssl x509 -in current.crt -noout -text > current-text.txt 2>/dev/null; then
        print_red "Could not parse the current leaf certificate."
        exit 1
      fi
      tr ',' '\n' < current-text.txt | grep -o 'DNS:[^ ,]*' > current-sans.txt || true
      if [ ! -s current-sans.txt ]; then
        if grep -q 'Subject Alternative Name' current-text.txt; then
          print_red "The leaf carries a SAN extension but none could be read; refusing to reissue blindly. Check that 'grep -o' works in the bootstrap image."
          exit 1
        fi
        print_yellow "Leaf carries no SANs; reissuing."
        return 0
      fi
      for san in{{ range (include "tfy-llm-gateway.bootstrap.mtlsDnsNames" . | fromYamlArray) }} {{ . | quote }}{{ end }}; do
        if ! grep -qxF "DNS:$san" current-sans.txt; then
          print_yellow "Leaf is missing SAN '$san'; reissuing."
          return 0
        fi
      done
      return 1
    }

    # --- Leaf cert: server+client cert signed by the CA. Stored in the mounted leaf
    # secret WITHOUT the CA private key (ca.crt, tls.key, tls.crt). -------------------
    make_leaf() {
      print_yellow "Issuing leaf cert valid for ${LEAF_DAYS} days."
      openssl genrsa -out tls.key 2048
      openssl req -new -key tls.key -out tls.csr -subj "/O=TrueFoundry/CN=truefoundry-internal"
      {
        echo "subjectAltName = @alt"
        echo "basicConstraints = critical, CA:FALSE"
        echo "extendedKeyUsage = serverAuth, clientAuth"
        echo "keyUsage = critical, digitalSignature, keyEncipherment"
        echo "[alt]"
{{- $dns := include "tfy-llm-gateway.bootstrap.mtlsDnsNames" . | fromYamlArray }}
{{- range $i, $d := $dns }}
        echo "DNS.{{ add1 $i }} = {{ $d }}"
{{- end }}
      } > ext.cnf
      openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
        -sha256 -days "$LEAF_DAYS" -extfile ext.cnf -out tls.crt
      kubectl -n "$NS" create secret generic "$TLS_SECRET" \
        --from-file=ca.crt=ca.crt \
        --from-file=tls.key=tls.key --from-file=tls.crt=tls.crt \
        --dry-run=client -o yaml | kubectl apply -f -
      if tls_secret_has_ca_key; then
        kubectl -n "$NS" patch secret "$TLS_SECRET" --type=json \
          -p='[{"op":"remove","path":"/data/ca.key"}]'
      fi
      print_green "mTLS secret '$TLS_SECRET' created/updated."
    }

    # forceRenew reissues unconditionally. The remaining checks only ever inspect the
    # CURRENT cert's expiry, so a leafDays change is otherwise invisible until the cert
    # drifts inside the renewBeforeDays window; this is the supported way to roll the leaf
    # on demand.
    force_renew() {
      # Strictly the boolean true. Helm renders a YAML bool as exactly "true"/"false",
      # so anything else (including the string "True" or 1) is treated as not set.
      [ "$FORCE_RENEW" = "true" ] || return 1
      print_yellow "global.mTLS.forceRenew is set; reissuing the leaf regardless of remaining validity."
      return 0
    }

    # Re-issue if forceRenew is set, the leaf is missing/expiring, it is not signed by the
    # current CA, it lacks an expected SAN, or the mounted secret still holds ca.key.
    # Persist the CA only after make_leaf succeeds so a failed issuance cannot leave a
    # committed CA that skips work on retry.
    ensure_ca
    fetch_current_leaf
    if force_renew || leaf_needs_renewal || ! leaf_signed_by_ca || leaf_missing_sans || tls_secret_has_ca_key; then
      make_leaf
      persist_ca
    else
      print_yellow "Leaf cert still valid beyond ${RENEW_BEFORE_DAYS}d and signed by the current CA; nothing to do."
    fi
{{- end }}
