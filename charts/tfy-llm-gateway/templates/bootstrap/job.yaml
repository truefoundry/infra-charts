{{- if eq (include "tfy-llm-gateway.bootstrap.enabled" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tfy-llm-gateway.bootstrap.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "tfy-llm-gateway.bootstrap.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-llm-gateway.bootstrap.jobAnnotations" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit | default 2 }}
  template:
    metadata:
      labels:
        {{- include "tfy-llm-gateway.bootstrap.podLabels" . | nindent 8 }}
      annotations:
        {{- include "tfy-llm-gateway.bootstrap.podAnnotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "tfy-llm-gateway.bootstrap.serviceAccountName" . }}
      {{- with (include "tfy-llm-gateway.podSecurityContext" (dict "local" .Values.bootstrap.podSecurityContext "global" .Values.global.podSecurityContext)) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.registry | default .Values.global.image.registry }}/{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrap.imagePullPolicy | default "IfNotPresent" }}
          {{- with (include "tfy-llm-gateway.containerSecurityContext" (dict "local" .Values.bootstrap.securityContext "global" .Values.global.containerSecurityContext)) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          command: ["/truefoundry/tfy-llm-gateway-bootstrap.sh"]
          env:
            - name: TRUEFOUNDRY_NAMESPACE
              value: {{ include "global.namespace" . }}
            {{- with .Values.bootstrap.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- include "tfy-llm-gateway.bootstrap.resources" . | trim | nindent 12 }}
          volumeMounts:
            - name: bootstrap-script
              mountPath: /truefoundry
              readOnly: true
            - name: workdir
              mountPath: /tmp/workdir
      volumes:
        - name: bootstrap-script
          secret:
            secretName: {{ include "tfy-llm-gateway.bootstrap.fullname" . }}
            defaultMode: 0755
        - name: workdir
          emptyDir:
            sizeLimit: {{ .Values.bootstrap.emptyDir.workdir.sizeLimit | default "100Mi" }}
      {{- with (include "tfy-llm-gateway.bootstrap.imagePullSecrets" . | fromYamlArray) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (mergeOverwrite (deepCopy .Values.global.nodeSelector) .Values.bootstrap.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.bootstrap.affinity | default .Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.bootstrap.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
