{{- if and (eq (include "tfy-llm-gateway.bootstrap.enabled" .) "true") .Values.bootstrap.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tfy-llm-gateway.bootstrap.serviceAccountName" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "tfy-llm-gateway.bootstrap.serviceAccountLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-llm-gateway.bootstrap.serviceAccountAnnotations" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
