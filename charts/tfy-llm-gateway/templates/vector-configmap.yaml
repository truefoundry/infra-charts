{{- if .Values.vector.enabled }}
{{- $tls := dict "enabled" true "crt_file" "/etc/tls/truefoundry/tls.crt" "key_file" "/etc/tls/truefoundry/tls.key" "ca_file" "/etc/tls/truefoundry/ca.crt" "verify_certificate" true }}
{{- $grpc := dict "address" "0.0.0.0:4317" }}
{{- $http := dict "address" "0.0.0.0:4318" }}
{{- if .Values.vector.mtls.enabled }}
{{- $_ := set $grpc "tls" $tls }}
{{- $_ := set $http "tls" $tls }}
{{- end }}
{{- $forward := .Values.vector.forward }}
{{- $config := dict
  "data_dir" .Values.vector.dataDir
  "secret" (dict "tfy" (dict "type" "directory" "path" "/etc/vector-secrets" "remove_trailing_whitespace" true))
  "api" (dict "enabled" true "address" "0.0.0.0:8686")
  "sources" (dict
    "otel_in" (dict "type" "opentelemetry" "grpc" $grpc "http" $http "use_otlp_decoding" (dict "traces" true "metrics" true "logs" true))
    "vector_metrics" (dict "type" "internal_metrics" "scrape_interval_secs" 15))
  "sinks" (dict
    "prom_exporter" (dict "type" "prometheus_exporter" "inputs" (list "vector_metrics") "address" "0.0.0.0:9598")
    "tfy_otel_traces" (dict
      "type" "opentelemetry"
      "inputs" (list "otel_in.traces")
      "acknowledgements" (dict "enabled" true)
      "buffer" (dict "type" "disk" "max_size" (int64 .Values.vector.buffer.maxSizeBytes) "when_full" .Values.vector.buffer.whenFull)
      "protocol" (dict
        "type" "http"
        "uri" (printf "%s/api/otel/v1/traces" (trimSuffix "/" .Values.global.controlPlaneURL))
        "method" "post"
        "encoding" (dict "codec" "otlp")
        "retry_strategy" (dict "type" "custom" "status_codes" $forward.retryStatusCodes)
        "request" (dict
          "timeout_secs" $forward.timeoutSecs
          "retry_initial_backoff_secs" $forward.retryInitialBackoffSecs
          "retry_max_duration_secs" $forward.retryMaxDurationSecs
          "headers" (dict "Authorization" "Bearer SECRET[tfy.TFY_API_KEY]" "Tfy-Service-Name" "tfy-llm-gateway")))))
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ first .Values.vector.existingConfigMaps }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "tfy-llm-gateway.labels" . | nindent 4 }}
data:
  vector.yaml: |
    {{- toYaml $config | nindent 4 }}
{{- end }}
