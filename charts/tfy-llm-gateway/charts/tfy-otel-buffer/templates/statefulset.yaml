{{- $customCA := .Values.global.customCA }}
{{- $directMountCA := include "tfy-otel-buffer.customCA.directMount" . }}
{{- $nodeSelector := mergeOverwrite (deepCopy (.Values.global.nodeSelector | default dict)) (.Values.nodeSelector | default dict) }}
{{- $tolerations := .Values.tolerations | default .Values.global.tolerations }}
{{- $affinity := .Values.affinity | default .Values.global.affinity }}
{{- $podLabels := mergeOverwrite (deepCopy (.Values.global.podLabels | default dict)) (.Values.podLabels | default dict) }}
{{- $podAnnotations := mergeOverwrite (deepCopy (.Values.global.podAnnotations | default dict)) (.Values.podAnnotations | default dict) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tfy-otel-buffer.fullname" . }}
  namespace: {{ include "tfy-otel-buffer.namespace" . }}
  labels:
    {{- include "tfy-otel-buffer.labels" . | nindent 4 }}
  {{- with .Values.global.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "tfy-otel-buffer.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "tfy-otel-buffer.fullname" . }}-headless
  template:
    metadata:
      labels:
        {{- include "tfy-otel-buffer.selectorLabels" . | nindent 8 }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* Config changes are reloaded in place by --watch-config, so the config is not hashed here. */}}
        checksum/ca: {{ include (print $.Template.BasePath "/custom-ca-configmap.yaml") . | sha256sum }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tfy-otel-buffer.serviceAccountName" . }}
      imagePullSecrets:
        {{- include "tfy-otel-buffer.imagePullSecrets" . | nindent 8 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $customCA.enabled (not $directMountCA) }}
      initContainers:
        - name: configure-custom-ca
          image: {{ printf "%s/%s:%s" ($customCA.image.registry | default .Values.global.image.registry) $customCA.image.repository $customCA.image.tag | quote }}
          command: ["sh", "-c"]
          args:
            - cat /etc/ssl/certs/ca-certificates.crt /custom-ca/ca-certificates.crt > /ssl-certs/ca-certificates.crt
          {{- with $customCA.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: custom-ca
              mountPath: /custom-ca
              readOnly: true
            - name: ssl-certs
              mountPath: /ssl-certs
      {{- end }}
      containers:
        - name: otel-buffer
          image: {{ include "tfy-otel-buffer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config-dir
            - /etc/otel-buffer/config/
            {{- /* ConfigMap updates swap the ..data symlink; the default inotify watch follows the inode and never fires. */}}
            - --watch-config
            - --watch-config-method
            - poll
            - --watch-config-poll-interval-seconds
            - "30"
          env:
            - name: VECTOR_LOG
              value: {{ .Values.logLevel | quote }}
            - name: VECTOR_MAX_DECOMPRESSED_SIZE_BYTES
              value: {{ .Values.maxDecompressedSizeBytes | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: api
              containerPort: 8686
              protocol: TCP
            - name: prom-exporter
              containerPort: 9598
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /otel-buffer-data
            - name: config
              mountPath: /etc/otel-buffer/config/
              readOnly: true
            - name: tfy-credentials
              mountPath: /etc/otel-buffer/secrets
              readOnly: true
            - name: additional-sink-credentials
              mountPath: /etc/otel-buffer/additional-sink-credentials
              readOnly: true
            {{- if eq (include "tfy-otel-buffer.mtls" .) "true" }}
            - name: truefoundry-mtls
              mountPath: /etc/tls/truefoundry
              readOnly: true
            {{- end }}
            {{- if $customCA.enabled }}
            - name: {{ ternary "custom-ca" "ssl-certs" (eq $directMountCA "true") }}
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tfy-otel-buffer.fullname" . }}-config
        - name: tfy-credentials
          secret:
            secretName: {{ .Values.forward.apiKeySecret.name }}
            items:
              - key: {{ .Values.forward.apiKeySecret.key }}
                path: TFY_API_KEY
        - name: additional-sink-credentials
          secret:
            secretName: {{ .Values.additionalSinksCredentials.secretName }}
            optional: true
        {{- if eq (include "tfy-otel-buffer.mtls" .) "true" }}
        - name: truefoundry-mtls
          secret:
            secretName: {{ include "tfy-otel-buffer.mtlsSecretName" . }}
        {{- end }}
        {{- if $customCA.enabled }}
        - name: custom-ca
          configMap:
            name: {{ include "tfy-otel-buffer.customCA.configMapName" . }}
        {{- if not $directMountCA }}
        - name: ssl-certs
          emptyDir:
            sizeLimit: 10Mi
        {{- end }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
