{{- include "tfy-otel-buffer.validate" . }}
{{- $tls := dict "enabled" true "crt_file" "/etc/tls/truefoundry/tls.crt" "key_file" "/etc/tls/truefoundry/tls.key" "ca_file" "/etc/tls/truefoundry/ca.crt" "verify_certificate" true }}
{{- $grpc := dict "address" "0.0.0.0:4317" }}
{{- $http := dict "address" "0.0.0.0:4318" }}
{{- if eq (include "tfy-otel-buffer.mtls" .) "true" }}
{{- $_ := set $grpc "tls" $tls }}
{{- $_ := set $http "tls" $tls }}
{{- end }}
{{- $forward := .Values.forward }}
{{- $batch := dict }}
{{- range $key, $field := dict "maxBytes" "max_bytes" "maxEvents" "max_events" "timeoutSecs" "timeout_secs" }}
{{- if and (hasKey $forward.batch $key) (not (kindIs "invalid" (index $forward.batch $key))) }}
{{- $_ := set $batch $field (index $forward.batch $key) }}
{{- end }}
{{- end }}
{{- $protocol := dict
  "type" "http"
  "uri" (printf "%s/api/otel/v1/traces" (trimSuffix "/" .Values.global.controlPlaneURL))
  "method" "post"
  "compression" $forward.compression
  "encoding" (dict "codec" "otlp")
  "retry_strategy" (dict "type" "custom" "status_codes" $forward.retryStatusCodes)
  "request" (dict
    "timeout_secs" $forward.timeoutSecs
    "retry_initial_backoff_secs" $forward.retryInitialBackoffSecs
    "retry_max_duration_secs" $forward.retryMaxDurationSecs
    "headers" (dict "Authorization" "Bearer SECRET[tfy.TFY_API_KEY]" "Tfy-Service-Name" "tfy-llm-gateway"))
}}
{{- if $batch }}
{{- $_ := set $protocol "batch" $batch }}
{{- end }}
{{- $config := dict
  "data_dir" "/otel-buffer-data"
  "secret" (dict
    "tfy" (dict "type" "directory" "path" "/etc/otel-buffer/secrets" "remove_trailing_whitespace" true)
    "additional_sink_credentials" (dict "type" "directory" "path" "/etc/otel-buffer/additional-sink-credentials" "remove_trailing_whitespace" true))
  "api" (dict "enabled" true "address" "0.0.0.0:8686")
  "sources" (dict
    "otel_in" (dict "type" "opentelemetry" "grpc" $grpc "http" $http "use_otlp_decoding" (dict "traces" true "metrics" true "logs" true))
    "internal_metrics" (dict "type" "internal_metrics" "scrape_interval_secs" 15))
  "sinks" (dict
    "prom_exporter" (dict "type" "prometheus_exporter" "inputs" (list "internal_metrics") "address" "0.0.0.0:9598")
    "tfy_otel_traces" (dict
      "type" "opentelemetry"
      "inputs" (list "otel_in.traces")
      "acknowledgements" (dict "enabled" true)
      "buffer" (dict "type" "disk" "max_size" (int64 .Values.buffer.maxSizeBytes) "when_full" .Values.buffer.whenFull)
      "protocol" $protocol))
}}
{{- range $id, $sink := .Values.additionalSinks }}
{{- $rendered := deepCopy $sink }}
{{- range $key, $default := $.Values.additionalSinkDefaults }}
{{- if not (hasKey $rendered $key) }}
{{- $_ := set $rendered $key (deepCopy $default) }}
{{- end }}
{{- end }}
{{- $_ := set $config.sinks $id $rendered }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tfy-otel-buffer.fullname" . }}-config
  namespace: {{ include "tfy-otel-buffer.namespace" . }}
  labels:
    {{- include "tfy-otel-buffer.labels" . | nindent 4 }}
  {{- with .Values.global.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
