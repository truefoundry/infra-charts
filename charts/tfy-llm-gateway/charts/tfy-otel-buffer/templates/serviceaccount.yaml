{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tfy-otel-buffer.serviceAccountName" . }}
  namespace: {{ include "tfy-otel-buffer.namespace" . }}
  labels:
    {{- include "tfy-otel-buffer.labels" . | nindent 4 }}
  {{- $annotations := mergeOverwrite (deepCopy (.Values.global.annotations | default dict)) (.Values.serviceAccount.annotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
