{{- range $suffix := list "" "-headless" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tfy-otel-buffer.fullname" $ }}{{ $suffix }}
  namespace: {{ include "tfy-otel-buffer.namespace" $ }}
  labels:
    {{- include "tfy-otel-buffer.labels" $ | nindent 4 }}
  {{- with $.Values.global.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  {{- if $suffix }}
  clusterIP: None
  {{- end }}
  ports:
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: otlp-http
    - name: api
      port: 8686
      protocol: TCP
      targetPort: api
  selector:
    {{- include "tfy-otel-buffer.selectorLabels" $ | nindent 4 }}
{{- end }}
