## @section Gateway API CRDs
##
## @param installGatewayCrds Install the Gateway API CRDs sub-chart. Set to false to only install the istio gateway sub-chart and skip the CRDs.
##
installGatewayCrds: true

## @section ALB Configuration
## Configuration for AWS Application Load Balancer
##
alb:
  ## @param alb.ingress.enabled Enable ALB ingress
  ##
  ingress:
    enabled: false
    ## @param alb.ingress.ingressClassName Ingress class name for ALB
    ##
    ingressClassName: alb
    ## @param alb.ingress.annotations Additional annotations for the ALB ingress
    ##
    annotations: {}
    ## @param alb.ingress.flyte.enabled Enable HTTP2 ALB ingress path for Flyte
    ##
    flyte:
      enabled: true
    ## @param alb.ingress.additionalHttp2Paths Additional HTTP2 paths to be configured
    ## Example:
    ## additionalHttp2Paths:
    ##   - path: /test123
    ##     pathType: Prefix
    ##     servicePort: 80
    ##     serviceName: test-service
    additionalHttp2Paths: []

## @section AppGW Configuration
## Configuration for Azure Application Gateway (AKS)
##
appgw:
  ## @param appgw.ingress.enabled Enable AppGW ingress
  ##
  ingress:
    enabled: false
    ## @param appgw.ingress.ingressClassName Ingress class name for AppGW
    ##
    ingressClassName: azure-application-gateway
    ## @param appgw.ingress.labels Additional labels for the AppGW ingress
    ##
    labels: {}
    ## @param appgw.ingress.annotations Additional annotations for the AppGW ingress
    ##
    annotations: {}
    ## @param appgw.ingress.flyte.enabled Enable HTTP2 AppGW ingress path for Flyte
    ## When enabled, the Flyte ingress reuses appgw.ingress.domains for host-based routing and TLS —
    ## it does not have its own separate domains list.
    ##
    flyte:
      enabled: true
    ## @param appgw.ingress.additionalHttp2Paths Additional HTTP2 paths to be configured
    ## Example:
    ## additionalHttp2Paths:
    ##   - path: /test123
    ##     pathType: Prefix
    ##     servicePort: 80
    ##     serviceName: test-service
    additionalHttp2Paths: []
    ## @param appgw.ingress.domains List of domains for host-based routing, shared by the main and Flyte AppGW ingresses
    ## Each entry has a list of hosts and may optionally include a secretName for TLS termination.
    ## The secretName can reference a Kubernetes TLS secret synced from Azure Key Vault
    ## via the Secrets Store CSI Driver, or any other Kubernetes TLS secret.
    ## Example:
    ## domains:
    ##   - hosts:
    ##       - example.com
    ##     secretName: example-tls
    ##   - hosts:
    ##       - api.example.com
    ##     secretName: api-example-tls
    ## Wildcard example (matches any host, takes precedence over the entries above):
    ## domains:
    ##   - hosts:
    ##       - "*"
    ##     secretName: wildcard-tls
    domains: []

## @section Gateway Configuration
## Configuration for the Gateway component
##
gateway:
  autoscaling:
    ## @param gateway.autoscaling.minReplicas Minimum number of replicas for autoscaling the Gateway.
    ##
    minReplicas: 3
    ## @param gateway.autoscaling.maxReplicas Maximum number of replicas for autoscaling the Gateway.
    ##
    maxReplicas: 100
    ## @param gateway.autoscaling.targetCPUUtilizationPercentage CPU utilization percentage wrt requests for scaling gateway pods
    ##
    targetCPUUtilizationPercentage: 70

  ## @param gateway.resources [object] Resource section for the gateway pods
  ##
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  ## Spread the gateway across nodes and across availability zones, so that losing a single node or a
  ## single zone cannot take out every replica of the ingress.
  ##
  ## Both entries are best-effort: the scheduler prefers an even spread but still places a pod when an
  ## even spread is not possible. That is safe on every cluster, including single-zone clusters and
  ## bare-metal clusters whose nodes carry no `topology.kubernetes.io/zone` label.
  ##
  ## On a cluster you know has at least three zones, you can make the zone spread a hard requirement by
  ## setting `whenUnsatisfiable: DoNotSchedule` and adding `minDomains: 3` to the zone entry. Kubernetes
  ## only honours `minDomains` alongside `DoNotSchedule` and rejects it otherwise, which is why it is
  ## absent below. Weigh it carefully for an ingress: `DoNotSchedule` refuses to place a pod on any node
  ## missing the zone label, and where the nodes the gateway is allowed onto span fewer than `minDomains`
  ## zones it caps the gateway at one replica per zone and leaves the surplus Pending, which also stops
  ## it autoscaling under load. Any nodeSelector/affinity you set narrows the nodes that count, so it is
  ## that subset which has to cover the zones, not the cluster as a whole.
  ##
  ## Helm cannot template a sub-chart's values, so the selector below is written out literally rather
  ## than derived from the release name. The istio gateway sub-chart labels its pods `app: <release>`
  ## and `istio: <release>`, so under a release name other than `tfy-istio-ingress` this selector matches
  ## no pods and the spread quietly does nothing; override the list to fix the names up in that case.
  ## @param gateway.topologySpreadConstraints [array] Topology spread constraints for the gateway pods
  ##
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: tfy-istio-ingress
          istio: tfy-istio-ingress
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: tfy-istio-ingress
          istio: tfy-istio-ingress

## @section tfyGateway Configuration for the tfyGateway.
##
tfyGateway:
  ## @param tfyGateway.name Name of the tfyGateway.
  ##
  name: ''
  ## @param tfyGateway.labels Labels for the tfyGateway.
  ##
  labels: {}
  ## @param tfyGateway.annotations Annotations for the tfyGateway.
  ##
  annotations: {}
  spec:
    selector:
      ## @param tfyGateway.spec.selector.istio Selector to enable istio for tfyGateway
      istio: '{{ .Release.Name }}'
    servers:
      ## @param tfyGateway.spec.servers[0].hosts List of hosts for the first server.
      ##
      - hosts: []
        ## Configuration for the port of the first server.
        ##
        ## @param tfyGateway.spec.servers[0].port.name Name of the port.
        ##
        ## @param tfyGateway.spec.servers[0].port.number Port number for http.
        ##
        ## @param tfyGateway.spec.servers[0].port.protocol Protocol of the port.
        ##
        ## @param tfyGateway.spec.servers[0].port.tls.httpsRedirect TLS configuration for the port.
        ##
        port:
          name: http-tfy-wildcard
          number: 80
          protocol: HTTP
          tls:
            httpsRedirect: true
      ## @param tfyGateway.spec.servers[1].hosts List of hosts for the second server.
      ##
      - hosts: []
        ## Configuration for the port of the second server.
        ##
        ## @param tfyGateway.spec.servers[1].port.name Name of the port.
        ##
        ## @param tfyGateway.spec.servers[1].port.number Port number for https.
        ##
        ## @param tfyGateway.spec.servers[1].port.protocol Protocol of the port.
        ##
        port:
          name: https-tfy-wildcard
          number: 443
          protocol: HTTPS

## @section telemetry Configuration for the telemetry.
##
telemetry:
  ## @param telemetry.enabled Enable telemetry.
  ##
  enabled: false
  ## @param telemetry.accessLogging [array] Access logging for the telemetry.
  ##
  accessLogging:
    - providers:
      - name: envoy


## @section awsElbControllerChecker Job that verifies aws-load-balancer-controller deployment has 2 pods up.
##
awsElbControllerChecker:
  ## @param awsElbControllerChecker.enabled Enable the aws-load-balancer-controller checker job.
  ##
  enabled: false
  ## @param awsElbControllerChecker.labels Labels for the aws-load-balancer-controller checker job.
  ##
  labels: {}
  ## @param awsElbControllerChecker.annotations Annotations for the aws-load-balancer-controller checker job.
  ##
  annotations: {}
  ## @param awsElbControllerChecker.jobLabels Labels for the aws-load-balancer-controller checker job.
  ##
  jobLabels: {}
  ## @param awsElbControllerChecker.jobAnnotations Annotations for the aws-load-balancer-controller checker job.
  ##
  jobAnnotations: {}
  ## @param awsElbControllerChecker.deploymentName Name of the aws-load-balancer-controller deployment to check.
  ##
  deploymentName: "aws-load-balancer-controller"
  ## @param awsElbControllerChecker.namespace Namespace where the aws-load-balancer-controller deployment runs.
  ##
  namespace: "aws-load-balancer-controller"
  ## @param awsElbControllerChecker.waitTimeoutSeconds Time in seconds to wait for aws-load-balancer-controller pods to come up (default 3 mins).
  ##
  waitTimeoutSeconds: 180
  image:
    ## @param awsElbControllerChecker.image.repository Repository for the checker job (helm-kubectl-based).
    repository: tfy.jfrog.io/tfy-mirror/dtzar/helm-kubectl
    ## @param awsElbControllerChecker.image.tag Tag for the checker job (helm-kubectl-based).
    ##
    tag: "3.19.1"
    ## @param awsElbControllerChecker.image.pullPolicy Pull policy for the checker job (helm-kubectl-based).
    ##
    pullPolicy: IfNotPresent
  ## @param awsElbControllerChecker.serviceAccount.create Create a dedicated ServiceAccount for the checker job.
  ## @param awsElbControllerChecker.serviceAccount.name Name of existing ServiceAccount to use when create is false.
  ##
  serviceAccount:
    create: true
    name: ""
  ## @param awsElbControllerChecker.resources Resource limits/requests for the checker job.
  ##
  resources: {}
  ## @param awsElbControllerChecker.backoffLimit Number of retries before the job is marked failed.
  ##
  backoffLimit: 3
