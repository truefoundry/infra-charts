{{- if .Values.alb.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-port: status-port
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/group.name: {{ .Release.Name }}
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds={{ .Values.alb.ingress.idleTimeoutSeconds }},routing.http2.enabled=true,access_logs.s3.enabled={{ .Values.alb.ingress.accessLogs.enabled }}{{- if .Values.alb.ingress.accessLogs.enabled }},access_logs.s3.bucket={{ required "alb.ingress.accessLogs.bucket is required when alb.ingress.accessLogs.enabled is true" .Values.alb.ingress.accessLogs.bucket }}{{- if .Values.alb.ingress.accessLogs.prefix }},access_logs.s3.prefix={{ .Values.alb.ingress.accessLogs.prefix }}{{- end }}{{- end }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    {{- range $key, $value := .Values.alb.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.alb.ingress.ingressClassName }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 80
{{- if .Values.alb.ingress.flyte.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-flyte-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-port: status-port
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/group.name: {{ .Release.Name }}
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
    alb.ingress.kubernetes.io/backend-protocol-version: "HTTP2"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    {{- range $key, $value := .Values.alb.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.alb.ingress.ingressClassName }}
  rules:
  - http:
      paths:
      - backend:
          service:
            name: {{ .Release.Name }}
            port:
              number: 80
        path: /flyteidl.service.AdminService
        pathType: Prefix
      {{- range .Values.alb.ingress.additionalHttp2Paths }}
      - backend:
          service:
            name: {{ .serviceName | default $.Release.Name }}
            port:
              number: {{ .servicePort | default 80 }}
        path: {{ .path }}
        pathType: {{ .pathType }}
      {{- end }}
{{- end }}
{{- end }}