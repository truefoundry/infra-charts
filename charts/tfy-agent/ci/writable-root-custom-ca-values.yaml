# Writable root on tfyAgent (no emptyDirs, no KUBECACHEDIR) with the custom CA initContainer.
config:
  clusterToken: "ci-test-cluster-token"
  controlPlaneURL: "https://cp.example.com"
  tenantName: "ci"
tfyAgent:
  securityContext:
    readOnlyRootFilesystem: false
global:
  customCA:
    enabled: true
    certificate: |
      -----BEGIN CERTIFICATE-----
      MIIBszCCAVmgAwIBAgIUJ8TestOnlyNotARealCertificate0wCgYIKoZIzj0EAwIw
      -----END CERTIFICATE-----
