# 63-character fullname: NetworkPolicy names must still fit in 63 characters.
# Also covers extraIngress without allowedIngressFrom, and sdsServer.ingressFrom: [] (no sds-server-clients policy).
fullnameOverride: tfy-agent-with-a-deliberately-long-release-name-for-ci-coverage
networkPolicy:
  enabled: true
  extraIngress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 3000
          protocol: TCP
  sdsServer:
    ingressFrom: []
