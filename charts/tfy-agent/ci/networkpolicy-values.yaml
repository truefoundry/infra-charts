config:
  clusterToken: "ci-test-cluster-token"
  controlPlaneURL: "https://cp.example.com"
  tenantName: "ci"
networkPolicy:
  enabled: true
  allowedIngressFrom:
    - namespace: prometheus
    - namespace: ingress-nginx
      podSelector:
        app.kubernetes.io/name: ingress-nginx
  extraIngress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 3000
          protocol: TCP
