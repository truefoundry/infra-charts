{{- if not .Values.config.clusterTokenSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfy-agent.secretName" . }}
  labels:
    external-secrets.io/type: webhook
    {{- include "tfy-agent.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-agent.commonAnnotations" . | nindent 4 }}
stringData:
  {{- if and .Values.config.multiLogicalClusterEnabled .Values.logicalClusters }}
  CLUSTER_TOKEN: {{ default (index .Values.logicalClusters 0).token .Values.config.clusterToken | required "config.clusterToken or logicalClusters[0].token is required" | quote }}
  {{- $seenTokenKeys := dict }}
  {{- range $index, $cluster := .Values.logicalClusters }}
  {{- $name := required (printf "logicalClusters[%d].name is required" $index) $cluster.name }}
  {{- $tokenKey := default (printf "CLUSTER_TOKEN_%s" $name) $cluster.tokenSecretKey }}
  {{- $token := required (printf "logicalClusters[%d].token is required when config.clusterTokenSecret is empty" $index) $cluster.token }}
  {{- if hasKey $seenTokenKeys $tokenKey }}
  {{- if ne (get $seenTokenKeys $tokenKey) $token }}
  {{- fail (printf "logical clusters using tokenSecretKey %q must use the same token" $tokenKey) }}
  {{- end }}
  {{- else }}
  {{- $_ := set $seenTokenKeys $tokenKey $token }}
  {{ $tokenKey }}: {{ $token | quote }}
  {{- end }}
  {{- end }}
  {{- else }}
  CLUSTER_TOKEN: {{ .Values.config.clusterToken | quote }}
  {{- end }}
{{- end }}