{{- if not .Values.config.clusterTokenSecret -}}
{{- $wifOnly := and .Values.config.workloadIdentity.enabled .Values.config.clusterFqn (not .Values.config.clusterToken) }}
{{- if and (not $wifOnly) (not .Values.config.clusterToken) (le (len .Values.clustersConfig) 1) }}
{{- fail "config.clusterToken is required unless config.workloadIdentity.enabled and config.clusterFqn are set (WIF-only)" }}
{{- end }}
{{- $hasMultiToken := false }}
{{- if gt (len .Values.clustersConfig) 1 }}
{{- range $index, $cluster := .Values.clustersConfig }}
{{- $resolved := include "tfy-agent.clustersConfig.resolved" (dict "index" $index "cluster" $cluster "root" $) | fromJson }}
{{- if index $resolved "hasToken" }}{{ $hasMultiToken = true }}{{ end }}
{{- end }}
{{- end }}
{{- if or .Values.config.clusterToken $hasMultiToken (and (le (len .Values.clustersConfig) 1) (not $wifOnly)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfy-agent.secretName" . }}
  labels:
    external-secrets.io/type: webhook
    {{- include "tfy-agent.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-agent.commonAnnotations" . | nindent 4 }}
stringData:
  {{- if gt (len .Values.clustersConfig) 1 }}
  {{- if .Values.config.clusterToken }}
  CLUSTER_TOKEN: {{ .Values.config.clusterToken | quote }}
  {{- else if (index .Values.clustersConfig 0).token }}
  CLUSTER_TOKEN: {{ (index .Values.clustersConfig 0).token | quote }}
  {{- else }}
  CLUSTER_TOKEN: ""
  {{- end }}
  {{- $seenTokenKeys := dict }}
  {{- range $index, $cluster := .Values.clustersConfig }}
  {{- $resolved := include "tfy-agent.clustersConfig.resolved" (dict "index" $index "cluster" $cluster "root" $) | fromJson }}
  {{- if index $resolved "hasToken" }}
  {{- $tokenKey := index $resolved "tokenSecretKey" }}
  {{- $token := required (printf "clustersConfig[%d].token is required when config.clusterTokenSecret is empty" $index) $cluster.token }}
  {{- if hasKey $seenTokenKeys $tokenKey }}
  {{- if ne (get $seenTokenKeys $tokenKey) $token }}
  {{- fail (printf "logical clusters using tokenSecretKey %q must use the same token" $tokenKey) }}
  {{- end }}
  {{- else }}
  {{- $_ := set $seenTokenKeys $tokenKey $token }}
  {{ $tokenKey }}: {{ $token | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- else if .Values.config.clusterToken }}
  CLUSTER_TOKEN: {{ .Values.config.clusterToken | quote }}
  {{- else }}
  CLUSTER_TOKEN: ""
  {{- end }}
{{- end }}
{{- end }}
