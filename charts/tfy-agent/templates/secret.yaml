{{- if not .Values.config.clusterTokenSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfy-agent.secretName" . }}
  labels:
    external-secrets.io/type: webhook
    {{- include "tfy-agent.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-agent.commonAnnotations" . | nindent 4 }}
stringData:
  {{- if gt (len .Values.clustersConfig) 1 }}
  CLUSTER_TOKEN: {{ default (index .Values.clustersConfig 0).token .Values.config.clusterToken | required "config.clusterToken or clustersConfig[0].token is required" | quote }}
  {{- $seenTokenKeys := dict }}
  {{- range $index, $cluster := .Values.clustersConfig }}
  {{- $resolved := include "tfy-agent.clustersConfig.resolved" (dict "index" $index "cluster" $cluster) | fromJson }}
  {{- $tokenKey := index $resolved "tokenSecretKey" }}
  {{- $token := required (printf "clustersConfig[%d].token is required when config.clusterTokenSecret is empty" $index) $cluster.token }}
  {{- if hasKey $seenTokenKeys $tokenKey }}
  {{- if ne (get $seenTokenKeys $tokenKey) $token }}
  {{- fail (printf "logical clusters using tokenSecretKey %q must use the same token" $tokenKey) }}
  {{- end }}
  {{- else }}
  {{- $_ := set $seenTokenKeys $tokenKey $token }}
  {{ $tokenKey }}: {{ $token | quote }}
  {{- end }}
  {{- end }}
  {{- else }}
  CLUSTER_TOKEN: {{ .Values.config.clusterToken | quote }}
  {{- end }}
{{- end }}