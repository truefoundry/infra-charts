{{- if index .Values "external-secrets-operator" "clusterSecretStore" "create" -}}
{{- if and .Values.config.multiLogicalClusterEnabled .Values.logicalClusters }}
{{- $root := . }}
{{- $seenStores := dict }}
{{- $seenTenants := dict }}
{{- range $index, $cluster := .Values.logicalClusters }}
{{- $name := required (printf "logicalClusters[%d].name is required" $index) $cluster.name }}
{{- $tenantName := required (printf "logicalClusters[%d].tenantName is required" $index) $cluster.tenantName }}
{{- $storeName := default (printf "tfy-secret-store-%s" $tenantName) $cluster.clusterSecretStoreName }}
{{- $tokenKey := default (printf "CLUSTER_TOKEN_%s" $name) $cluster.tokenSecretKey }}
{{- $controlPlaneURL := required (printf "logicalClusters[%d].controlPlaneURL is required" $index) $cluster.controlPlaneURL }}
{{- $normalizedControlPlaneURL := trimSuffix "/" $controlPlaneURL }}
{{- $tenantConfig := printf "%s|%s" $storeName $normalizedControlPlaneURL }}
{{- if and (hasKey $seenTenants $tenantName) (ne (get $seenTenants $tenantName) $tenantConfig) }}
{{- fail (printf "logical clusters sharing tenant %q must use the same ClusterSecretStore and controlPlaneURL" $tenantName) }}
{{- end }}
{{- $_ := set $seenTenants $tenantName $tenantConfig }}
{{- if hasKey $seenStores $storeName }}
{{- if ne (get $seenStores $storeName) $tenantName }}
{{- fail (printf "ClusterSecretStore %q cannot be shared by different tenants" $storeName) }}
{{- end }}
{{- else }}
{{- $_ := set $seenStores $storeName $tenantName }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "tfy-agent.commonLabels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    {{- include "tfy-agent.commonAnnotations" $root | nindent 4 }}
spec:
  provider:
    webhook:
      url: {{ printf "%s/api/svc/v1/control-plane/secret?secret_ref=%s" (trimSuffix "/" $controlPlaneURL) "{{ .remoteRef.key }}" | quote }}
      method: GET
      result:
        jsonPath: $.value
      headers:
        Authorization: {{ printf "Bearer %s" "{{ .auth.CLUSTER_TOKEN }}" | quote }}
      secrets:
        - name: auth
          secretRef:
            key: {{ $tokenKey }}
            name: {{ include "tfy-agent.secretName" $root }}
            namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ index .Values "external-secrets-operator" "clusterSecretStore" "name" }}
  labels:
    {{- include "tfy-agent.commonLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    {{- include "tfy-agent.commonAnnotations" . | nindent 4 }}
spec:
  provider:
    webhook:
      url: {{ include "tfy-agent.clusterSecretStore.webhookUrl" . | quote }}
      method: GET
      result:
        jsonPath: $.value
      headers:
        Authorization: {{ printf "Bearer %s" "{{ .auth.CLUSTER_TOKEN }}" | quote }}
      secrets:
        - name: auth
          secretRef:
            key: CLUSTER_TOKEN
            name: {{ include "tfy-agent.secretName" . }}
            namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
