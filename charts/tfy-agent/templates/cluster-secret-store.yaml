{{- if and (index .Values "external-secrets-operator" "clusterSecretStore" "create") .Values.tfyAgent.enabled -}}
{{- $tokenSecretName := include "tfy-agent.secretName" . -}}
{{- $tokenSecretNamespace := .Release.Namespace -}}
{{- if gt (len .Values.clustersConfig) 1 }}
{{- $root := . }}
{{- $stores := (include "tfy-agent.clustersConfig.uniqueSecretStores" . | fromJson).stores }}
{{- range $store := $stores }}
{{- $tokenKey := index $store "tokenSecretKey" }}
{{- if not $tokenKey }}
{{- fail (printf "ClusterSecretStore %q requires a cluster token (token/tokenSecretKey); cluster token is mandatory for ESO → agent auth" (index $store "clusterSecretStoreName")) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ index $store "clusterSecretStoreName" }}
  labels:
    {{- include "tfy-agent.commonLabels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    {{- include "tfy-agent.commonAnnotations" $root | nindent 4 }}
spec:
  {{- if not (has "*" (index $store "namespaces")) }}
  conditions:
    - namespaces:
        {{- range $namespace := index $store "namespaces" }}
        - {{ $namespace | quote }}
        {{- end }}
  {{- end }}
  provider:
    webhook:
      # ESO → tfy-agent (Bearer cluster token) → SFY (agent attaches WIF)
      url: {{ include "tfy-agent.clusterSecretStore.webhookUrlForStore" (dict "root" $root "storeName" (index $store "clusterSecretStoreName")) | quote }}
      method: GET
      headers:
        Authorization: {{ printf "Bearer {{ .auth.%s }}" $tokenKey | quote }}
      secrets:
        - name: auth
          secretRef:
            name: {{ $tokenSecretName | quote }}
            namespace: {{ $tokenSecretNamespace | quote }}
      result:
        jsonPath: $.value
{{- end }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ index .Values "external-secrets-operator" "clusterSecretStore" "name" }}
  labels:
    {{- include "tfy-agent.commonLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    {{- include "tfy-agent.commonAnnotations" . | nindent 4 }}
spec:
  provider:
    webhook:
      # ESO → tfy-agent (Bearer cluster token) → SFY (agent attaches WIF)
      url: {{ include "tfy-agent.clusterSecretStore.webhookUrl" . | quote }}
      method: GET
      headers:
        Authorization: {{ printf "Bearer {{ .auth.%s }}" "CLUSTER_TOKEN" | quote }}
      secrets:
        - name: auth
          secretRef:
            name: {{ $tokenSecretName | quote }}
            namespace: {{ $tokenSecretNamespace | quote }}
      result:
        jsonPath: $.value
{{- end }}
{{- end }}
