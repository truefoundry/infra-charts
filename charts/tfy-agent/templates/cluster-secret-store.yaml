{{- if index .Values "external-secrets-operator" "clusterSecretStore" "create" -}}
{{- $root := . -}}
{{- $logicalClusters := .Values.config.logicalClusters | default list -}}
{{- if gt (len $logicalClusters) 0 }}
{{- range $logicalClusters }}
{{- $storeName := .name -}}
{{- $controlPlaneURL := .controlPlaneURL | default $root.Values.config.controlPlaneURL | toString | trimSuffix "/" -}}
{{- if not $controlPlaneURL -}}
{{- $controlPlaneURL = $root.Values.config.controlPlaneClusterIP | toString | trimSuffix "/" -}}
{{- end -}}
{{- $tokenSecretName := .clusterTokenSecret | default (printf "%s-%s-token" (include "tfy-agent.fullname" $root | trunc 40 | trimSuffix "-") .name) -}}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "tfy-agent.commonLabels" $root | nindent 4 }}
    truefoundry.com/logical-cluster: {{ .name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    {{- include "tfy-agent.commonAnnotations" $root | nindent 4 }}
spec:
  provider:
    webhook:
      url: {{ printf "%s/api/svc/v1/control-plane/secret?secret_ref=%s" $controlPlaneURL "{{ .remoteRef.key }}" | quote }}
      method: GET
      result:
        jsonPath: $.value
      headers:
        Authorization: {{ printf "Bearer %s" "{{ .auth.CLUSTER_TOKEN }}" | quote }}
      secrets:
        - name: auth
          secretRef:
            key: CLUSTER_TOKEN
            name: {{ $tokenSecretName }}
            namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- else }}
{{- $storeName := .Values.config.clusterSecretStoreName | default (index .Values "external-secrets-operator" "clusterSecretStore" "name") | default "tfy-secret-store" -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "tfy-agent.commonLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    {{- include "tfy-agent.commonAnnotations" . | nindent 4 }}
spec:
  provider:
    webhook:
      url: {{ include "tfy-agent.clusterSecretStore.webhookUrl" . | quote }}
      method: GET
      result:
        jsonPath: $.value
      headers:
        Authorization: {{ printf "Bearer %s" "{{ .auth.CLUSTER_TOKEN }}" | quote }}
      secrets:
        - name: auth
          secretRef:
            key: CLUSTER_TOKEN
            name: {{ include "tfy-agent.secretName" . }}
            namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
