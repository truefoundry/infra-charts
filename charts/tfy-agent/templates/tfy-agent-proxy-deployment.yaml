{{- if .Values.tfyAgentProxy.enabled }}
{{- $containerSC := include "tfy-agent.containerSecurityContext" (dict "local" .Values.tfyAgentProxy.securityContext "global" .Values.global.containerSecurityContext) }}
{{- $writableDirs := list }}
{{- if (fromYaml $containerSC).readOnlyRootFilesystem }}
{{- $writableDirs = list (dict "name" "writable-tmp" "path" "/tmp") }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tfy-agent-proxy.fullname" . }}
  labels:
    {{- include "tfy-agent-proxy.deploymentLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-agent-proxy.deploymentAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tfy-agent-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "tfy-agent-proxy.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "tfy-agent-proxy.podLabels" . | nindent 8 }}
    spec:
      {{- with .Values.tfyAgentProxy.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tfy-agent-proxy.serviceAccountName" . }}
      {{- with (include "tfy-agent.podSecurityContext" (dict "local" .Values.tfyAgentProxy.podSecurityContext "global" .Values.global.podSecurityContext)) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- if and .Values.global.customCA.enabled (eq (include "tfy-agent.customCA.useDirectMount" .) "false") }}
      initContainers:
        {{- include "tfy-agent.customCA.initContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-proxy
          {{- with $containerSC }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          env:
            {{- if $writableDirs }}
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
            {{- end }}
            {{- if .Values.config.controlPlaneURL }}
            - name: CONTROL_PLANE_URL
              value: {{ .Values.config.controlPlaneURL | quote }}
            {{- else }}
            - name: CONTROL_PLANE_URL
              value: {{ .Values.config.controlPlaneControllerClusterIP | quote }}
            {{- /* In-cluster path only for single-cluster mode. Multi mode dials
                 per-entry public controlPlaneURLs and needs the API gateway path. */}}
            {{- if le (len .Values.clustersConfig) 1 }}
            - name: CONTROL_PLANE_PATH
              value: "/proxy/cluster/connect"
            {{- end }}
            {{- end }}
            - name: CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: CLUSTER_TOKEN
                  name: {{ include "tfy-agent.secretName" .}}
            {{- if gt (len .Values.clustersConfig) 1 }}
            - name: CONTROL_PLANE_PATH
              value: "api/proxy-server/proxy/cluster/connect"
            - name: MULTI_LOGICAL_CLUSTER_ENABLED
              value: "true"
            - name: LOGICAL_CLUSTERS_CONFIG_PATH
              value: /etc/tfy-agent/logical-clusters/logical-clusters.yaml
            {{- end }}
          {{- range $val := .Values.tfyAgentProxy.extraEnvVars }}
            - name: {{ $val.name }}
              value: {{ $val.value | quote }}
          {{- end }}
            {{- include "tfy-agent.customCA.nodeEnv" . | nindent 12 }}
          image: "{{ .Values.tfyAgentProxy.image.repository }}:{{ .Values.tfyAgentProxy.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.tfyAgentProxy.image.pullPolicy }}
          resources:
            {{- toYaml .Values.tfyAgentProxy.resources | nindent 12 }}
          volumeMounts:
            {{- with $writableDirs }}
            {{- include "tfy-agent.writableDirs.volumeMounts" . | trim | nindent 12 }}
            {{- end }}
            {{- with .Values.tfyAgentProxy.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.global.customCA.enabled }}
            {{- include "tfy-agent.customCA.volumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if gt (len .Values.clustersConfig) 1 }}
            - name: clusters-config
              mountPath: /etc/tfy-agent/logical-clusters
              readOnly: true
            - name: cluster-tokens
              mountPath: /etc/tfy-agent/logical-cluster-tokens
              readOnly: true
            {{- end }}
      {{- with .Values.tfyAgentProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- with $writableDirs }}
        {{- include "tfy-agent.writableDirs.volumes" . | trim | nindent 8 }}
        {{- end }}
        {{- with .Values.tfyAgentProxy.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.global.customCA.enabled }}
        {{- include "tfy-agent.customCA.volumes" . | nindent 8 }}
        {{- end }}
        {{- if gt (len .Values.clustersConfig) 1 }}
        - name: clusters-config
          configMap:
            name: {{ include "tfy-agent.fullname" . }}-clusters-config
        - name: cluster-tokens
          secret:
            secretName: {{ include "tfy-agent.secretName" . }}
        {{- end }}
      {{- with .Values.tfyAgentProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tfyAgentProxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tfyAgentProxy.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
{{- end }}

