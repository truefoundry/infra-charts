{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $needsAPI := or .Values.tfyAgent.enabled .Values.tfyAgentProxy.enabled }}
{{- if and $needsAPI (not $np.kubeAPICIDRs) }}
{{- fail "networkPolicy.kubeAPICIDRs is required when networkPolicy.enabled is true (tfy-agent and tfy-agent-proxy talk to the Kubernetes API). Allow both addresses pods use for the API: (1) the `kubernetes` Service ClusterIP — AWS VPC CNI matches it before DNAT — via networkPolicy.kubeAPIServiceIP or a /32 in kubeAPICIDRs (kubectl -n default get svc kubernetes -o jsonpath='{.spec.clusterIP}'); (2) the API endpoint subnet CIDRs — Calico/Cilium match after DNAT (EKS: aws eks describe-cluster --name <cluster> --region <region> --query cluster.resourcesVpcConfig.subnetIds, then aws ec2 describe-subnets for CidrBlock). Example: kubeAPIServiceIP: 172.20.0.1, kubeAPICIDRs: [10.0.0.0/19, 10.0.32.0/19]." }}
{{- end }}
{{- if .Values.tfyAgent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tfy-agent.fullname" . }}
  labels:
    {{- include "tfy-agent.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-agent.commonAnnotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tfy-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.tfyAgent.service.port }}
      {{- with $np.tfyAgent.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- include "tfy-agent.networkPolicy.commonEgress" (dict "root" . "kubeAPI" true) | nindent 4 }}
    {{- if .Values.sdsServer.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "sds-server.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.sdsServer.service.port }}
    {{- end }}
    {{- range (list $np.prometheus $np.opencost) }}
    {{- if .enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          {{- with .podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
    {{- with $np.tfyAgent.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.tfyAgentProxy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tfy-agent-proxy.fullname" . }}
  labels:
    {{- include "tfy-agent-proxy.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-agent-proxy.commonAnnotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tfy-agent-proxy.selectorLabels" . | nindent 6 }}
  # The proxy dials out to the control plane and has no Service, so nothing may connect in.
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- include "tfy-agent.networkPolicy.commonEgress" (dict "root" . "kubeAPI" true) | nindent 4 }}
    {{- with $np.tfyAgentProxy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.sdsServer.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sds-server.fullname" . }}
  labels:
    {{- include "sds-server.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "sds-server.commonAnnotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sds-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or .Values.tfyAgent.enabled $np.sdsServer.ingressFrom }}
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.sdsServer.service.port }}
      from:
        {{- if .Values.tfyAgent.enabled }}
        - podSelector:
            matchLabels:
              {{- include "tfy-agent.selectorLabels" . | nindent 14 }}
        {{- end }}
        {{- with $np.sdsServer.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- end }}
  egress:
    {{- include "tfy-agent.networkPolicy.commonEgress" (dict "root" . "kubeAPI" false) | nindent 4 }}
    {{- with $np.sdsServer.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
