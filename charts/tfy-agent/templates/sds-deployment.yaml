{{- if .Values.sdsServer.enabled -}}
{{- $containerSC := include "tfy-agent.containerSecurityContext" (dict "local" .Values.sdsServer.securityContext "global" .Values.global.containerSecurityContext) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sds-server.fullname" . }}
  labels:
    {{- include "sds-server.deploymentLabels" . | nindent 4 }}
  annotations:
    {{- include "sds-server.deploymentAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.sdsServer.replicas}}
  selector:
    matchLabels:
      {{- include "sds-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "sds-server.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "sds-server.podLabels" . | nindent 8 }}
    spec:
      {{- with .Values.sdsServer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if (eq (include "tfy-agent.workloadIdentity.mountEnabled" .) "true") }}
      {{/* Same SA as tfy-agent so projected JWT claims match the cluster WIF mapping. */}}
      serviceAccountName: {{ include "tfy-agent.serviceAccountName" . }}
      {{- else }}
      serviceAccountName: {{ include "sds-server.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.sdsServer.serviceAccount.automountServiceAccountToken }}
      {{- with (include "tfy-agent.podSecurityContext" (dict "local" .Values.sdsServer.podSecurityContext "global" .Values.global.podSecurityContext)) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- if and .Values.global.customCA.enabled (eq (include "tfy-agent.customCA.useDirectMount" .) "false") }}
      initContainers:
        {{- include "tfy-agent.customCA.initContainer" . | nindent 8 }}
      {{- end }}
      {{- with .Values.sdsServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- with .Values.sdsServer.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.global.customCA.enabled }}
        {{- include "tfy-agent.customCA.volumes" . | nindent 8 }}
        {{- end }}
        {{- if (eq (include "tfy-agent.workloadIdentity.mountEnabled" .) "true") }}
        - name: workload-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ .Values.config.workloadIdentity.tokenFileName | quote }}
                  expirationSeconds: {{ .Values.config.workloadIdentity.expirationSeconds }}
                  audience: {{ .Values.config.workloadIdentity.audience | quote }}
        {{- end }}
        {{- if gt (len .Values.clustersConfig) 1 }}
        - name: clusters-config
          configMap:
            name: {{ include "tfy-agent.fullname" . }}-clusters-config
        {{- if eq (include "tfy-agent.clustersConfig.hasAnyToken" .) "true" }}
        - name: cluster-tokens
          secret:
            secretName: {{ include "tfy-agent.secretName" . }}
        {{- end }}
        {{- end }}
      {{- with .Values.sdsServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sdsServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - image: {{ .Values.sdsServer.image.repository }}:{{ .Values.sdsServer.image.tag }}
          imagePullPolicy: {{ .Values.sdsServer.image.pullPolicy }}
          name: sds-server
          {{- with $containerSC }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          command:
            {{- with .Values.sdsServer.command }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: CONTROL_PLANE_URL
              value: {{ include "tfy-agent.controlPlaneURL" . | quote }}
            {{- if or (eq (include "tfy-agent.clustersConfig.hasAnyToken" .) "true") (le (len .Values.clustersConfig) 1) }}
            - name: CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: CLUSTER_TOKEN
                  name: {{ include "tfy-agent.secretName" . }}
                  optional: {{ if or (eq (include "tfy-agent.workloadIdentity.mountEnabled" .) "true") (gt (len .Values.clustersConfig) 1) }}true{{ else }}false{{ end }}
            {{- end }}
            {{- if .Values.config.clusterFqn }}
            - name: CLUSTER_FQN
              value: {{ .Values.config.clusterFqn | quote }}
            {{- end }}
            {{- if (eq (include "tfy-agent.workloadIdentity.mountEnabled" .) "true") }}
            - name: WORKLOAD_IDENTITY_TOKEN_FILE
              value: {{ printf "%s/%s" .Values.config.workloadIdentity.mountPath .Values.config.workloadIdentity.tokenFileName | quote }}
            {{- end }}
            {{- if gt (len .Values.clustersConfig) 1 }}
            - name: MULTI_LOGICAL_CLUSTER_ENABLED
              value: "true"
            - name: LOGICAL_CLUSTERS_CONFIG_PATH
              value: /etc/tfy-agent/logical-clusters/logical-clusters.yaml
            {{- end }}
          {{- range $val := .Values.sdsServer.extraEnvVars }}
            - name: {{ $val.name }}
              value: {{ $val.value | quote }}
          {{- end }}
          readinessProbe:
            {{- toYaml .Values.sdsServer.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.sdsServer.livenessProbe | nindent 12 }}
          ports:
          - name: http
            containerPort: {{ .Values.sdsServer.service.port }}
            protocol: TCP
          resources:
            {{- with .Values.sdsServer.resources }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.global.customCA.enabled (eq (include "tfy-agent.workloadIdentity.mountEnabled" .) "true") (gt (len .Values.clustersConfig) 1) }}
          volumeMounts:
            {{- if .Values.global.customCA.enabled }}
            {{- include "tfy-agent.customCA.volumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if (eq (include "tfy-agent.workloadIdentity.mountEnabled" .) "true") }}
            - name: workload-identity-token
              mountPath: {{ .Values.config.workloadIdentity.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if gt (len .Values.clustersConfig) 1 }}
            - name: clusters-config
              mountPath: /etc/tfy-agent/logical-clusters
              readOnly: true
            {{- if eq (include "tfy-agent.clustersConfig.hasAnyToken" .) "true" }}
            - name: cluster-tokens
              mountPath: /etc/tfy-agent/logical-cluster-tokens
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      topologySpreadConstraints:
        {{- with .Values.sdsServer.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
