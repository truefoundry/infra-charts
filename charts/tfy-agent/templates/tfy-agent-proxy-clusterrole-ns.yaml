{{- if .Values.tfyAgentProxy.enabled -}}
{{- if .Values.tfyAgentProxy.clusterRole.enable -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tfy-agent-proxy.fullname" . }}-ns
  labels:
    {{- include "tfy-agent-proxy.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-agent-proxy.commonAnnotations" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["patch", "delete"]

  {{/* Workspace UI lists ServiceAccounts; workloads SAs are created by Argo CD */}}
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["list"]

  {{/*
    SSA create/patch for workspace SA token secrets and (when enableAlerts) alert-manager secrets.
    Note: patch responses include Secret data, so this is not a full "no-read" guarantee —
    prefer config.allowedNamespaces to limit blast radius.
  */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]

  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

  {{/* No pods create — workloads are created by Argo CD / controllers */}}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]

  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]

  {{/* This allows us to access tfy-istio-ingress service status under the istio-system namespace */}}
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["get"]

  - apiGroups: ["apps"]
    resources: ["statefulsets/scale", "deployments/scale"]
    verbs: ["patch"]

  {{- if .Values.tfyAgentProxy.clusterRole.enableAlerts }}
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "alertmanagerconfigs"]
    verbs: ["create", "delete", "patch"]

  {{/* SSA of ExternalSecrets for alert-manager */}}
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["create", "patch"]
  {{- end }}

  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]

  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "update"]

  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "create", "patch", "delete"]

  - apiGroups: ["argoproj.io"]
    resources: ["rollouts/scale", "rollouts/status"]
    verbs: ["patch"]

  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "workflowtemplates"]
    verbs: ["get"]

  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "patch"]

  {{/* Suspend/resume scheduled jobs */}}
  - apiGroups: ["argoproj.io"]
    resources: ["cronworkflows"]
    verbs: ["patch"]

  - apiGroups: ["kubeflow.org"]
    resources: ["notebooks"]
    verbs: ["get", "update"]

  {{- if .Values.tfyAgentProxy.clusterRole.enableIntercepts }}
  {{/* This allows us to create intercepts for redirection / shadowing traffic */}}
  - apiGroups: ["networking.istio.io"]
    resources: ["envoyfilters"]
    verbs: ["get", "create", "patch", "delete"]
  {{- end }}

  {{- if .Values.tfyAgentProxy.clusterRole.enableSpark }}
  {{/* This allows us to apply VirtualService for Spark UI when applying a SparkApplication (Spark Job Run) */}}
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["create", "patch"]

  {{/* This allows us to apply/delete SparkApplication (Spark Job Run) */}}
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications"]
    verbs: ["create", "get", "delete"]

  {{/* SparkConnect cleanup for Spark Notebook */}}
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkconnects"]
    verbs: ["delete"]
  {{- end }}
{{- end }}
{{- end }}
