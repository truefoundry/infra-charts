{{- if and .Values.secret.create (not .Values.secret.existingName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfy-scim-bridge.fullname" . }}
  labels:
    {{- include "tfy-scim-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  SCIM_TOKEN: {{ required "secret.scimToken is required when secret.create is true" .Values.secret.scimToken | quote }}
  {{- if .Values.secret.googleSaJsonB64 }}
  GOOGLE_SA_JSON_B64: {{ .Values.secret.googleSaJsonB64 | quote }}
  {{- end }}
{{- end }}
