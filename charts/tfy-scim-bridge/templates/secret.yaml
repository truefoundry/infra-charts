{{- if not .Values.secret.existingName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfy-scim-bridge.fullname" . }}
  labels:
    {{- include "tfy-scim-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "tfy-scim-bridge.scimTokenKey" . }}: {{ required "secret.scimToken is required when secret.existingName is empty" .Values.secret.scimToken | quote }}
  {{- if .Values.secret.googleSaJsonB64 }}
  {{ include "tfy-scim-bridge.googleSaJsonB64Key" . }}: {{ .Values.secret.googleSaJsonB64 | quote }}
  {{- end }}
{{- end }}
