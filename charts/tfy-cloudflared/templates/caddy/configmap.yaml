{{- if .Values.caddy.enabled }}
{{- /*
  Build the host capture group used by every proxy matcher out of
  caddy.allowedHosts: an alternation of the regex-escaped hostnames, so
  requests to any other target fail to match every matcher and fall through
  to the final `respond 404`.

  The allowlist is mandatory. Without it the group would be "([^/]+)", i.e.
  the upstream host is taken verbatim from the externally supplied request
  path, turning the tunnel endpoint into an open proxy (SSRF) to anything
  reachable from the Caddy pod's network.
*/}}
{{- $allowedHosts := list -}}
{{- range (default (list) .Values.caddy.allowedHosts) -}}
{{-   $host := trim (. | toString) -}}
{{-   if $host -}}
{{-     $allowedHosts = append $allowedHosts (regexQuoteMeta $host) -}}
{{-   end -}}
{{- end -}}
{{- if not $allowedHosts -}}
{{-   fail "caddy.allowedHosts must list at least one upstream hostname when caddy.enabled is true. Leaving it empty would let the Caddy router proxy to any host reachable from its pod network (SSRF). Set caddy.allowedHosts to the hostnames you intend to expose (e.g. svc.ns.svc.cluster.local), or set caddy.enabled=false." -}}
{{- end -}}
{{- $hostGroup := printf "(%s)" (join "|" $allowedHosts) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tfy-cloudflared.caddyFullname" . }}-config
  labels:
    {{- include "tfy-cloudflared.caddyCommonLabels" . | nindent 4 }}
  annotations:
    {{- include "tfy-cloudflared.commonAnnotations" . | nindent 4 }}
data:
  Caddyfile: |
    {
    	admin off

    	log {
    		output stdout
    		format json
    		level INFO
    	}
    }

    :80 {
    	encode zstd gzip

    	log {
    		output stdout
    		format json
    	}

    	respond /healthz 200

    	@direct_url_http path_regexp direct_url_http ^/[^/]+/http:/{1,2}{{ $hostGroup }}:([0-9]+)(?:/(.*))?$
    	handle @direct_url_http {
    		rewrite * /{re.direct_url_http.3}

    		reverse_proxy {re.direct_url_http.1}:{re.direct_url_http.2} {
    			header_up Host {re.direct_url_http.1}
    			header_up X-Forwarded-Host {host}
    			header_up X-Original-URI {uri}

    			lb_try_duration 5s
    			lb_try_interval 250ms
    			fail_duration 10s
    			max_fails 2

    			transport http {
    				dial_timeout 3s
    				response_header_timeout 30s
    				read_timeout 5m
    				write_timeout 5m
    			}
    		}
    	}

    	@direct_url_https path_regexp direct_url_https ^/[^/]+/https:/{1,2}{{ $hostGroup }}:([0-9]+)(?:/(.*))?$
    	handle @direct_url_https {
    		rewrite * /{re.direct_url_https.3}

    		reverse_proxy {re.direct_url_https.1}:{re.direct_url_https.2} {
    			header_up Host {re.direct_url_https.1}
    			header_up X-Forwarded-Host {host}
    			header_up X-Original-URI {uri}

    			lb_try_duration 5s
    			lb_try_interval 250ms
    			fail_duration 10s
    			max_fails 2

    			transport http {
    				tls
    				tls_server_name {re.direct_url_https.1}
    				dial_timeout 3s
    				response_header_timeout 30s
    				read_timeout 5m
    				write_timeout 5m
    			}
    		}
    	}

    	@direct_https path_regexp direct_https ^/[^/]+/https/{{ $hostGroup }}:([0-9]+)(?:/(.*))?$
    	handle @direct_https {
    		rewrite * /{re.direct_https.3}

    		reverse_proxy {re.direct_https.1}:{re.direct_https.2} {
    			header_up Host {re.direct_https.1}
    			header_up X-Forwarded-Host {host}
    			header_up X-Original-URI {uri}

    			lb_try_duration 5s
    			lb_try_interval 250ms
    			fail_duration 10s
    			max_fails 2

    			transport http {
    				tls
    				tls_server_name {re.direct_https.1}
    				dial_timeout 3s
    				response_header_timeout 30s
    				read_timeout 5m
    				write_timeout 5m
    			}
    		}
    	}

    	@direct_http path_regexp direct_http ^/[^/]+/{{ $hostGroup }}:([0-9]+)(?:/(.*))?$
    	handle @direct_http {
    		rewrite * /{re.direct_http.3}

    		reverse_proxy {re.direct_http.1}:{re.direct_http.2} {
    			header_up Host {re.direct_http.1}
    			header_up X-Forwarded-Host {host}
    			header_up X-Original-URI {uri}

    			lb_try_duration 5s
    			lb_try_interval 250ms
    			fail_duration 10s
    			max_fails 2

    			transport http {
    				dial_timeout 3s
    				response_header_timeout 30s
    				read_timeout 5m
    				write_timeout 5m
    			}
    		}
    	}

    	respond 404
    }
{{- end }}
