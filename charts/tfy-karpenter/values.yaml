## @section eks-node-monitoring-agent configurations
##
eks-node-monitoring-agent:
  ## @param eks-node-monitoring-agent.imagePullSecrets [array] Image pull secrets for eks-node-monitoring-agent and dcgm-server
  ##
  imagePullSecrets: []
  nodeAgent:
    image:
      ## @param eks-node-monitoring-agent.nodeAgent.image.repository Repository for the eks-node-monitoring-agent image
      ##
      repository: quay.io/tfy-images/eks/eks-node-monitoring-agent
      ## @param eks-node-monitoring-agent.nodeAgent.image.tag Tag for the eks-node-monitoring-agent image
      ##
      tag: v1.7.1-eksbuild.1
    ## @param eks-node-monitoring-agent.nodeAgent.resources [object] Resources for eks-node-monitoring-agent
    ##
    resources:
      requests:
        cpu: 60m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 200Mi

  dcgmAgent:
    image:
      ## @param eks-node-monitoring-agent.dcgmAgent.image.repository Repository for the dcgm-server image. Empty uses the nodeAgent image
      ##
      repository: ""
      ## @param eks-node-monitoring-agent.dcgmAgent.image.tag Tag for the dcgm-server image. Empty uses the nodeAgent tag
      ##
      tag: ""
    ## @param eks-node-monitoring-agent.dcgmAgent.resources [object] Resources for eks-node-monitoring-agent
    ##
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 512Mi
    ## @param eks-node-monitoring-agent.dcgmAgent.tolerations [array] Tolerations for eks-node-monitoring-agent
    ##
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists

## @section Upstream karpenter configurations
##
karpenter:
  ## @param karpenter.serviceAccount.annotations.eks.amazonaws.com/role-arn Karpenter role ARN
  ##
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: ''
  ## @param karpenter.logLevel Log level for karpenter
  ##
  logLevel: 'debug'

  settings:
    ## @param karpenter.settings.clusterName Name of the EKS cluster
    ##
    clusterName: 'cluster-name'

    ## @param karpenter.settings.clusterEndpoint Endpoint URL of the EKS cluster
    ##
    clusterEndpoint: ''

    ## @param karpenter.settings.interruptionQueue Name of the interruption queue for spot instances
    ##
    interruptionQueue: ''

    ## @param karpenter.settings.reservedENIs reserved ENIs for the custom networking CNI setup
    ##
    reservedENIs: '0'

    ## @param karpenter.settings.featureGates.nodeRepair Enable node repair feature gate
    ##
    featureGates:
      nodeRepair: true
  ## @param karpenter.controller.resources.requests.cpu CPU requests for karpenter container
  ## @param karpenter.controller.resources.requests.memory Memory requests for karpenter container
  ## @param karpenter.controller.resources.limits.cpu CPU limits for karpenter container
  ## @param karpenter.controller.resources.limits.memory Memory requests for karpenter container
  ##
  controller:
    resources:
      requests:
        cpu: 0.5
        memory: 2000Mi
      limits:
        cpu: 1
        memory: 4000Mi
  ## @param karpenter.serviceMonitor.enabled Enable service monitor for karpenter
  ##
  serviceMonitor:
    enabled: true
