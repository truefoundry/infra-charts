{{- if (index .Values "trueforge" "enabled") }}
{{- $useExternal := eq (include "truefoundry.redis.useExternal" .) "true" }}
{{- $existingSecret := .Values.externalRedis.existingSecret }}
{{- $url := include "truefoundry.redis.url" . }}
{{- $host := include "truefoundry.redis.host" . }}
{{- $sentinel := .Values.externalRedis.sentinel | default dict -}}
{{- $auth := .Values.externalRedis.auth | default dict -}}
{{- $tls := .Values.externalRedis.tls | default dict -}}
{{- $sentinelAuth := $sentinel.auth | default dict -}}
{{- $sentinelEnabled := eq (toString ($sentinel.enabled | default false)) "true" -}}
{{- $tlsEnabled := eq (toString ($tls.enabled | default false)) "true" -}}
{{- $rejectUnauthorized := true -}}
{{- if hasKey $tls "rejectUnauthorized" -}}
{{- $rejectUnauthorized = eq (toString $tls.rejectUnauthorized) "true" -}}
{{- end -}}
{{- if not (include "truefoundry.redis.available" .) }}
{{- fail "trueforge.enabled requires a Redis: set redis.enabled (bundled) or externalRedis.enabled with url, host, sentinel, or existingSecret" }}
{{- end }}
{{- if and (not $existingSecret) (or (kindIs "map" .Values.externalRedis.url) (kindIs "map" .Values.externalRedis.host) (kindIs "map" $auth.password) (kindIs "map" $auth.username) (kindIs "map" $tls.caCert) (kindIs "map" $tls.cert) (kindIs "map" $tls.key) (kindIs "map" $tls.keyPassphrase) (kindIs "map" $sentinelAuth.username) (kindIs "map" $sentinelAuth.password)) }}
{{- fail "externalRedis fields must be strings for trueforge-creds; for secret refs pre-create the Secret and set externalRedis.existingSecret: true" }}
{{- end }}
{{- if and $useExternal (not $existingSecret) (not .Values.externalRedis.url) (not .Values.externalRedis.host) (not $sentinelEnabled) }}
{{- fail "externalRedis.enabled requires url, host, or sentinel.enabled (or existingSecret: true with a pre-created trueforge-creds Secret)" }}
{{- end }}
{{- if and (not $existingSecret) .Values.externalRedis.url .Values.externalRedis.host }}
{{- fail "externalRedis.url and externalRedis.host are mutually exclusive" }}
{{- end }}
{{- if and (not $existingSecret) $sentinelEnabled (or .Values.externalRedis.url .Values.externalRedis.host) }}
{{- fail "externalRedis.sentinel cannot be combined with externalRedis.url or externalRedis.host" }}
{{- end }}
{{- if and $useExternal (not $existingSecret) $sentinelEnabled (not $sentinel.masterName) }}
{{- fail "externalRedis.sentinel.masterName is required when externalRedis.sentinel.enabled is true" }}
{{- end }}
{{- if and $useExternal (not $existingSecret) $sentinelEnabled (empty $sentinel.nodes) }}
{{- fail "externalRedis.sentinel.nodes is required when externalRedis.sentinel.enabled is true" }}
{{- end }}
{{- if and (not $existingSecret) (not $sentinelEnabled) .Values.externalRedis.url (or $auth.username $auth.password (ne ((.Values.externalRedis.db | default 0) | toString) "0")) }}
{{- fail "externalRedis.auth and a non-zero externalRedis.db are ignored when externalRedis.url is set; encode them in the url or use host mode" }}
{{- end }}
{{- /* TRUEFORGE_API_KEY must be non-empty whenever STANDALONE=false. The bootstrap job
       generates and preserves it; without that job it has to come from values. */}}
{{- if and (not .Values.truefoundryBootstrap.enabled) (not .Values.global.trueforgeApiKey) }}
{{- fail "trueforge.enabled requires global.trueforgeApiKey when truefoundryBootstrap.enabled is false" }}
{{- end }}
{{- /* With externalRedis.existingSecret the user pre-creates trueforge-creds
       so credentials never touch values or a rendered manifest. */}}
{{- if not $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: trueforge-creds
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "truefoundry.labels" (dict "context" . "name" "trueforge-creds") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- /* The app rejects more than one non-empty transport (url / host / sentinel);
         empty values read as unset. */}}
  REDIS_URL: {{ $url | quote }}
  {{- if $useExternal }}
  REDIS_HOST: {{ $host | quote }}
  REDIS_PORT: {{ (.Values.externalRedis.port | default 6379) | toString | quote }}
  REDIS_DB: {{ (.Values.externalRedis.db | default 0) | toString | quote }}
  REDIS_USERNAME: {{ ($auth.username | default "") | quote }}
  REDIS_PASSWORD: {{ ($auth.password | default "") | quote }}
  REDIS_TLS_ENABLED: {{ ternary "true" "false" $tlsEnabled | quote }}
  REDIS_TLS_CA_CERT: {{ ($tls.caCert | default "") | quote }}
  REDIS_TLS_REJECT_UNAUTHORIZED: {{ ternary "true" "false" $rejectUnauthorized | quote }}
  REDIS_TLS_SERVERNAME: {{ ($tls.serverName | default "") | quote }}
  REDIS_TLS_CERT: {{ ($tls.cert | default "") | quote }}
  REDIS_TLS_KEY: {{ ($tls.key | default "") | quote }}
  REDIS_TLS_KEY_PASSPHRASE: {{ ($tls.keyPassphrase | default "") | quote }}
  REDIS_SENTINEL_ENABLED: {{ ternary "true" "false" $sentinelEnabled | quote }}
  REDIS_SENTINEL_NODES: {{ (join "," ($sentinel.nodes | default list)) | quote }}
  REDIS_SENTINEL_MASTER_NAME: {{ ($sentinel.masterName | default "") | quote }}
  REDIS_SENTINEL_USERNAME: {{ ($sentinelAuth.username | default "") | quote }}
  REDIS_SENTINEL_PASSWORD: {{ ($sentinelAuth.password | default "") | quote }}
  {{- else }}
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ""
  REDIS_TLS_ENABLED: "false"
  REDIS_TLS_CA_CERT: ""
  REDIS_TLS_REJECT_UNAUTHORIZED: "true"
  REDIS_TLS_SERVERNAME: ""
  REDIS_TLS_CERT: ""
  REDIS_TLS_KEY: ""
  REDIS_TLS_KEY_PASSPHRASE: ""
  REDIS_SENTINEL_ENABLED: "false"
  REDIS_SENTINEL_NODES: ""
  REDIS_SENTINEL_MASTER_NAME: ""
  REDIS_SENTINEL_USERNAME: ""
  REDIS_SENTINEL_PASSWORD: ""
  {{- end }}
{{- end }}
{{- if .Values.global.trueforgeApiKey }}
---
{{- /* Explicit key: the chart owns it. When this is empty the bootstrap job
       generates one into the same Secret and preserves it across upgrades. */}}
apiVersion: v1
kind: Secret
metadata:
  name: trueforge-api-key
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "truefoundry.labels" (dict "context" . "name" "trueforge-api-key") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  TRUEFORGE_API_KEY: {{ .Values.global.trueforgeApiKey | quote }}
{{- end }}
{{- end }}
