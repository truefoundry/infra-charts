{{- if (index .Values "trueforge" "enabled") }}
{{- $useExternal := eq (include "truefoundry.redis.useExternal" .) "true" }}
{{- $externalSecret := eq (include "truefoundry.redis.externalSecret" .) "true" }}
{{- $host := include "truefoundry.redis.host" . }}
{{- $sentinel := .Values.externalRedis.sentinel | default dict -}}
{{- $auth := .Values.externalRedis.auth | default dict -}}
{{- $tls := .Values.externalRedis.tls | default dict -}}
{{- $sentinelAuth := $sentinel.auth | default dict -}}
{{- $sentinelEnabled := eq (toString ($sentinel.enabled | default false)) "true" -}}
{{- $tlsEnabled := eq (toString ($tls.enabled | default false)) "true" -}}
{{- $rejectUnauthorized := true -}}
{{- if hasKey $tls "rejectUnauthorized" -}}
{{- $rejectUnauthorized = eq (toString $tls.rejectUnauthorized) "true" -}}
{{- end -}}
{{- $trueforge := .Values.trueforge | default dict -}}
{{- $trueforgeEnv := $trueforge.env | default dict -}}
{{- $redisURL := index $trueforgeEnv "REDIS_URL" | default "" -}}
{{- if and (kindIs "string" $redisURL) $redisURL }}
{{- fail "trueforge.env.REDIS_URL is not supported. Use REDIS_HOST or Sentinel" }}
{{- end }}
{{- range $name, $value := $trueforgeEnv }}
{{- if and (kindIs "string" $value) (hasPrefix "${k8s-secret" $value) (ne (include "truefoundry.redis.threePartRef" (dict "value" $value)) "true") }}
{{- fail (printf "trueforge.env.%s must name the Secret: ${k8s-secret/<secret>/<key>}" $name) }}
{{- end }}
{{- end }}
{{- if and .Values.redis.enabled $useExternal }}
{{- fail "redis.enabled and externalRedis.enabled are mutually exclusive" }}
{{- end }}
{{- if and $externalSecret (not $useExternal) }}
{{- fail "externalRedis.externalSecret: true requires externalRedis.enabled: true" }}
{{- end }}
{{- if $externalSecret }}
{{- if or .Values.redis.enabled .Values.externalRedis.host $sentinelEnabled }}
{{- fail "externalRedis.externalSecret: true ignores redis.enabled, externalRedis.host, and externalRedis.sentinel. Clear those and set trueforge.env" }}
{{- end }}
{{- $envHost := index $trueforgeEnv "REDIS_HOST" | default "" -}}
{{- $envNodes := index $trueforgeEnv "REDIS_SENTINEL_NODES" | default "" -}}
{{- $chartHostRef := "${k8s-secret/trueforge-redis-creds/REDIS_HOST}" -}}
{{- $chartNodesRef := "${k8s-secret/trueforge-redis-creds/REDIS_SENTINEL_NODES}" -}}
{{- $hostOK := and (kindIs "string" $envHost) $envHost (ne $envHost $chartHostRef) -}}
{{- $nodesOK := and (kindIs "string" $envNodes) $envNodes (ne $envNodes $chartNodesRef) -}}
{{- if not (or $hostOK $nodesOK) }}
{{- fail "externalRedis.externalSecret: true requires trueforge.env.REDIS_HOST or trueforge.env.REDIS_SENTINEL_NODES" }}
{{- end }}
{{- else }}
{{- $hasHost := .Values.externalRedis.host -}}
{{- if and $useExternal (not $hasHost) (not $sentinelEnabled) }}
{{- fail "externalRedis.enabled requires externalRedis.host or externalRedis.sentinel.enabled" }}
{{- end }}
{{- if and $hasHost $sentinelEnabled }}
{{- fail "externalRedis.host and externalRedis.sentinel are mutually exclusive" }}
{{- end }}
{{- if and $useExternal $sentinelEnabled (not $sentinel.masterName) }}
{{- fail "externalRedis.sentinel.masterName is required when externalRedis.sentinel.enabled is true" }}
{{- end }}
{{- if and $useExternal $sentinelEnabled (empty $sentinel.nodes) }}
{{- fail "externalRedis.sentinel.nodes is required when externalRedis.sentinel.enabled is true" }}
{{- end }}
{{- if not (or .Values.redis.enabled $useExternal) }}
{{- fail "trueforge.enabled requires a Redis: set redis.enabled (bundled) or externalRedis.enabled with host or sentinel, or externalRedis.externalSecret: true and trueforge.env" }}
{{- end }}
{{- end }}
{{- /* Passwords may be ${k8s-secret/<secret>/<key>}. A Secret cannot reference
       another Secret, so that string is not copied. The pod reads it from trueforge.env. */}}
{{- $password := $auth.password | default "" -}}
{{- $sentinelPassword := $sentinelAuth.password | default "" -}}
{{- if and (not $externalSecret) $useExternal }}
{{- if kindIs "map" $password }}
{{- fail "externalRedis.auth.password must be a string. For a Secret, set trueforge.env.REDIS_PASSWORD to \"${k8s-secret/<secret>/<key>}\"" }}
{{- end }}
{{- if kindIs "map" $sentinelPassword }}
{{- fail "externalRedis.sentinel.auth.password must be a string. For a Secret, set trueforge.env.REDIS_SENTINEL_PASSWORD to \"${k8s-secret/<secret>/<key>}\"" }}
{{- end }}
{{- if and (kindIs "string" $password) (hasPrefix "${k8s-secret" $password) }}
{{- if ne (include "truefoundry.redis.threePartRef" (dict "value" $password)) "true" }}
{{- fail "externalRedis.auth.password must use ${k8s-secret/<secret>/<key>}" }}
{{- end }}
{{- $envPassword := index $trueforgeEnv "REDIS_PASSWORD" | default "" -}}
{{- if ne (toString $envPassword) $password }}
{{- fail "externalRedis.auth.password is a Secret reference, which cannot be copied into trueforge-redis-creds. Set trueforge.env.REDIS_PASSWORD to the same ${k8s-secret/<secret>/<key>} string" }}
{{- end }}
{{- $password = "" -}}
{{- end }}
{{- if and (kindIs "string" $sentinelPassword) (hasPrefix "${k8s-secret" $sentinelPassword) }}
{{- if ne (include "truefoundry.redis.threePartRef" (dict "value" $sentinelPassword)) "true" }}
{{- fail "externalRedis.sentinel.auth.password must use ${k8s-secret/<secret>/<key>}" }}
{{- end }}
{{- $envSentinelPassword := index $trueforgeEnv "REDIS_SENTINEL_PASSWORD" | default "" -}}
{{- if ne (toString $envSentinelPassword) $sentinelPassword }}
{{- fail "externalRedis.sentinel.auth.password is a Secret reference, which cannot be copied into trueforge-redis-creds. Set trueforge.env.REDIS_SENTINEL_PASSWORD to the same ${k8s-secret/<secret>/<key>} string" }}
{{- end }}
{{- $sentinelPassword = "" -}}
{{- end }}
{{- range $field, $value := (dict "host" .Values.externalRedis.host "auth.username" $auth.username "tls.caCert" $tls.caCert "tls.serverName" $tls.serverName "tls.cert" $tls.cert "tls.key" $tls.key "tls.keyPassphrase" $tls.keyPassphrase "sentinel.masterName" $sentinel.masterName "sentinel.auth.username" $sentinelAuth.username) }}
{{- if kindIs "map" $value }}
{{- fail (printf "externalRedis.%s must be a string. This chart copies it into trueforge-redis-creds. For a Secret, set the matching trueforge.env.REDIS_* key to \"${k8s-secret/<secret>/<key>}\" and leave this field empty" $field) }}
{{- end }}
{{- if and (kindIs "string" $value) (hasPrefix "${k8s-secret" $value) }}
{{- fail (printf "externalRedis.%s cannot hold a ${k8s-secret/...} reference. Set the matching trueforge.env.REDIS_* key to \"${k8s-secret/<secret>/<key>}\" and leave this field empty" $field) }}
{{- end }}
{{- end }}
{{- range $node := ($sentinel.nodes | default list) }}
{{- if and (kindIs "string" $node) (hasPrefix "${k8s-secret" $node) }}
{{- fail "externalRedis.sentinel.nodes entries cannot hold a ${k8s-secret/...} reference. Set trueforge.env.REDIS_SENTINEL_NODES to \"${k8s-secret/<secret>/<key>}\" and leave nodes empty, or use externalRedis.externalSecret: true" }}
{{- end }}
{{- end }}
{{- end }}
{{- /* TRUEFORGE_API_KEY must be non-empty whenever STANDALONE=false. The bootstrap job
       generates and preserves it; without that job it has to come from values. */}}
{{- if and (not .Values.truefoundryBootstrap.enabled) (not .Values.global.trueforgeApiKey) }}
{{- fail "trueforge.enabled requires global.trueforgeApiKey when truefoundryBootstrap.enabled is false" }}
{{- end }}
{{- if not $externalSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: trueforge-redis-creds
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "truefoundry.labels" (dict "context" . "name" "trueforge-redis-creds") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- /* Empty values read as unset. Host and Sentinel are mutually exclusive. */}}
  {{- if $useExternal }}
  REDIS_HOST: {{ $host | quote }}
  REDIS_PORT: {{ (.Values.externalRedis.port | default 6379) | toString | quote }}
  REDIS_DB: {{ (.Values.externalRedis.db | default 0) | toString | quote }}
  REDIS_USERNAME: {{ ($auth.username | default "") | quote }}
  REDIS_PASSWORD: {{ $password | quote }}
  REDIS_TLS_ENABLED: {{ ternary "true" "false" $tlsEnabled | quote }}
  REDIS_TLS_CA_CERT: {{ ($tls.caCert | default "") | quote }}
  REDIS_TLS_REJECT_UNAUTHORIZED: {{ ternary "true" "false" $rejectUnauthorized | quote }}
  REDIS_TLS_SERVERNAME: {{ ($tls.serverName | default "") | quote }}
  REDIS_TLS_CERT: {{ ($tls.cert | default "") | quote }}
  REDIS_TLS_KEY: {{ ($tls.key | default "") | quote }}
  REDIS_TLS_KEY_PASSPHRASE: {{ ($tls.keyPassphrase | default "") | quote }}
  REDIS_SENTINEL_ENABLED: {{ ternary "true" "false" $sentinelEnabled | quote }}
  REDIS_SENTINEL_NODES: {{ (join "," ($sentinel.nodes | default list)) | quote }}
  REDIS_SENTINEL_MASTER_NAME: {{ ($sentinel.masterName | default "") | quote }}
  REDIS_SENTINEL_USERNAME: {{ ($sentinelAuth.username | default "") | quote }}
  REDIS_SENTINEL_PASSWORD: {{ $sentinelPassword | quote }}
  {{- else }}
  REDIS_HOST: {{ $host | quote }}
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ""
  REDIS_TLS_ENABLED: "false"
  REDIS_TLS_CA_CERT: ""
  REDIS_TLS_REJECT_UNAUTHORIZED: "true"
  REDIS_TLS_SERVERNAME: ""
  REDIS_TLS_CERT: ""
  REDIS_TLS_KEY: ""
  REDIS_TLS_KEY_PASSPHRASE: ""
  REDIS_SENTINEL_ENABLED: "false"
  REDIS_SENTINEL_NODES: ""
  REDIS_SENTINEL_MASTER_NAME: ""
  REDIS_SENTINEL_USERNAME: ""
  REDIS_SENTINEL_PASSWORD: ""
  {{- end }}
{{- end }}
{{- if .Values.global.trueforgeApiKey }}
---
{{- /* Explicit key: the chart owns it. When this is empty the bootstrap job
       generates one into the same Secret and preserves it across upgrades. */}}
apiVersion: v1
kind: Secret
metadata:
  name: trueforge-api-key
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "truefoundry.labels" (dict "context" . "name" "trueforge-api-key") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  TRUEFORGE_API_KEY: {{ .Values.global.trueforgeApiKey | quote }}
{{- end }}
{{- end }}
