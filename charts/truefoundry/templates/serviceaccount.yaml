{{- if .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.serviceAccount.name }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "global.labels" . | nindent 4 }}
  annotations:
    {{- include "global.serviceAccountAnnotations" . | nindent 4 }}
{{- if hasKey .Values.global.serviceAccount "automountServiceAccountToken" }}
automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- $restricted := .Values.global.restrictedServiceAccount | default dict }}
{{- if and $restricted.enabled $restricted.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "truefoundry.restrictedServiceAccountName" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- toYaml (mergeOverwrite (deepCopy (.Values.global.labels | default dict)) ($restricted.labels | default dict)) | nindent 4 }}
  annotations:
    {{- toYaml (mergeOverwrite (deepCopy (.Values.global.annotations | default dict)) ($restricted.annotations | default dict)) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
