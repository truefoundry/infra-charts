{{- if and (or .Values.tags.llmGatewayRequestLogging .Values.tags.tracing) .Values.deltaFusionIngestor.enabled }}
{{- if .Values.deltaFusionCompaction.enabled }}
{{- include "deltafusion-compaction.cronJob" . }}
{{- range $jobKey, $jobOverride := .Values.deltaFusionCompaction.additionalJobs | default dict }}
{{- if and (kindIs "map" $jobOverride) (ne (dig "enabled" true $jobOverride) false) }}
---
{{ include "deltafusion-compaction.additionalCronJob" (dict "root" $ "jobKey" $jobKey "jobOverride" $jobOverride) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
