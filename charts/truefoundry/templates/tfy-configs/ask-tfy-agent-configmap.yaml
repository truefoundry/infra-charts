{{- $tc := .Values.tfyConfigs | default dict -}}
{{- if and $tc.enabled .Values.tags.askTfy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ask-tfy-agent-cm
  namespace: {{ include "global.namespace" . }}
data:
  ask-tfy-agent.yaml: |-
    {{- if not $tc.configs.askTfyAgentOverride }}
    {{ .Files.Get "files/tfy-configs/ask-tfy-agent.yaml" | nindent 4 }}
    {{- else }}
    {{ $tc.configs.askTfyAgentOverride | nindent 4 }}
    {{- end }}
{{- end }}
