{{- if not .Values.global.existingTruefoundryCredsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: truefoundry-creds
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "global.labels" . | nindent 4 }}
  annotations:
    {{- include "global.annotations" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.devMode.enabled }}
  DB_HOST: >-
    truefoundry-postgresql.{{ include "global.namespace" . }}
  DB_USERNAME: "postgres"
  DB_PASSWORD: "truefoundry"
  DB_NAME: "truefoundry"
  {{- else }}
  {{- $db := .Values.global.database }}
  {{- /* Fail fast on a partial database config, but let a fully empty one
  template so CI can render the chart with default values. Password may be
  legitimately empty (e.g. trust auth); the rest never can. */}}
  {{- if or $db.host $db.username $db.name $db.password }}
  DB_HOST: {{ required "global.database.host is required (or enable devMode, or bring your own truefoundry-creds Secret via global.existingTruefoundryCredsSecret)" $db.host }}
  DB_USERNAME: {{ required "global.database.username is required (or enable devMode, or bring your own truefoundry-creds Secret via global.existingTruefoundryCredsSecret)" $db.username }}
  DB_PASSWORD: {{ $db.password }}
  DB_NAME: {{ required "global.database.name is required (or enable devMode, or bring your own truefoundry-creds Secret via global.existingTruefoundryCredsSecret)" $db.name }}
  {{- else }}
  DB_HOST: {{ $db.host }}
  DB_USERNAME: {{ $db.username }}
  DB_PASSWORD: {{ $db.password }}
  DB_NAME: {{ $db.name }}
  {{- end }}
  {{- end }}
  TFY_API_KEY: {{ .Values.global.tfyApiKey | quote }}
{{- end }}
