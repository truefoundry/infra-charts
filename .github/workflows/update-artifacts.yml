name: Generate Inframold Charts Artifacts Manifest

# Regenerates the inframold charts' artifacts-manifest.json files. When they are
# out of date, it hands the new files to bot-commit.yml, which pushes them onto
# the PR branch.
#
# This runs the PR's own code, so it holds no write token and no allow-listed IP:
# a pull_request run executes the PR's copy of this file, so any credential it
# could mint, anyone with write access could mint from a branch without a merge.
# It uploads what it generated as the `bot-commit` artifact and fails, so the PR
# can't merge with stale manifests. The bot's commit runs this again, and that
# run passes.
#
# bot-commit.yml is named after this workflow's `name:` above. Renaming either
# one silently stops the bot commits.
on:
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Was dorny/paths-filter, which lists a PR's files through the GitHub API
      # with GITHUB_TOKEN, and that call is filtered by the org IP allow list on
      # ubuntu-latest. GITHUB_SHA is the PR's merge commit and its first parent
      # is the base tip, so an anonymous fetch gives the same list.
      - name: Detect Relevant Path Changes
        id: filter
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=2 origin "+${GITHUB_SHA}:refs/remotes/origin/merge"
          changed="$(git diff --name-only origin/merge^1 origin/merge)"
          if grep -qE '^(\.github/workflows/update-artifacts\.yml$|charts/tfy-k8s-(aws-eks|azure-aks|civo-talos|gcp-gke-standard|generic)-inframold/|scripts/(generate-artifacts-manifest|upload-artifacts)/)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  update-artifacts:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # AWS role for public ECR
    env:
      ARTIFACTORY_REPOSITORY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      ARTIFACTORY_HELM_REGISTRY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_HELM_REGISTRY }}

    steps:
      # Anonymous: infra-charts is public, so no token and no allow-listed IP.
      # The PR's head, not its merge commit, because that is what the bot
      # commits onto.
      - name: Check out the PR head (anonymous)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "+${HEAD_SHA}:refs/remotes/origin/head"
          git checkout -q --detach origin/head

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Log in to JFrog Artifactory
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PRIVATE_READONLY_USERNAME }}
          password: ${{ secrets.TRUEFOUNDRY_ARTIFACTORY_PRIVATE_READONLY_PASSWORD }}
          registry: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}

      # Pull-only role: logging in only raises the public ECR pull rate limit.
      # The push role (PUBLIC_ECR_IAM_ROLE_ARN, sync-image.yaml) does not trust
      # this repo's pull_request runs, and must not.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PUBLIC_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Install python dependencies
        run: |
          pip install -r scripts/upload-artifacts/requirements.txt
          pip install -r scripts/generate-artifacts-manifest/requirements.txt

      # Generate artifacts manifest for inframold charts
      - name: Generate Artifacts Manifest for Each Chart
        run: |
          charts_list=("tfy-k8s-aws-eks-inframold" "tfy-k8s-azure-aks-inframold" "tfy-k8s-gcp-gke-standard-inframold" "tfy-k8s-civo-talos-inframold" "tfy-k8s-generic-inframold")
          for chart in "${charts_list[@]}"; do
            version=$(grep '^version:' "charts/$chart/Chart.yaml" | awk '{print $2}')
            python scripts/generate-artifacts-manifest/artifacts_template_generator.py "$chart" "https://truefoundry.github.io/infra-charts/" \
              "$version" "charts/$chart/values-artifact-manifest.yaml" "charts/$chart/artifacts-manifest.json" scripts/generate-artifacts-manifest/extra.json
          done
        env:
          MODE: 'local'

      # Check if truefoundry chart images support amd64 and arm64
      - name: Check if Truefoundry Chart Images Support Multiple Architectures
        run: |
          python scripts/generate-artifacts-manifest/check_chart_images_support_multiple_architectures.py \
          charts/tfy-k8s-aws-eks-inframold/artifacts-manifest.json \
          scripts/generate-artifacts-manifest/multi-arch-image-whitelist.json

      - name: Collect updated manifests
        id: manifests_changed
        run: |
          changed="$(git diff --name-only -- 'charts/*/artifacts-manifest.json')"
          if [ -z "$changed" ]; then
            echo "Artifacts manifests are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r f; do
            if [ -L "$f" ]; then
              echo "::error::${f} is a symlink. Not collecting it."
              exit 1
            fi
            mkdir -p "${RUNNER_TEMP}/bot-commit/$(dirname "$f")"
            cp "$f" "${RUNNER_TEMP}/bot-commit/${f}"
            echo "Out of date: ${f}"
          done <<< "$changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hand the manifests to bot-commit.yml
        if: steps.manifests_changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bot-commit
          path: ${{ runner.temp }}/bot-commit
          retention-days: 1

      - name: Fail until the bot commits
        if: steps.manifests_changed.outputs.changed == 'true'
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::error::Artifacts manifests are out of date. Regenerate them and push the result. The bot can't push to a fork."
          else
            echo "::error::Artifacts manifests were out of date. bot-commit.yml is pushing the regenerated files to this branch, and this check passes on that commit."
          fi
          exit 1

  artifact-generation-gate:
    needs: [ changes, update-artifacts ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify Required jobs
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          # update-artifacts is allowed to be skipped
          if [ "${{ needs.update-artifacts.result }}" = "failure" ]; then exit 1; fi
