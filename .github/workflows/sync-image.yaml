name: Sync container images

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths:
      - 'scripts/sync-images/**'
      - '.github/workflows/sync-image.yaml'

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_REGISTRY: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Anonymous: infra-charts is public, so the checkout needs no token and works
      # from any IP. A token-authenticated checkout is filtered by the org IP allow
      # list, and ubuntu-latest has no allow-listed address.
      - name: Check out (anonymous)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "+${GITHUB_SHA}:refs/remotes/origin/ci"
          git checkout -q --detach origin/ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (skopeo + PyYAML)
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          python -m pip install --upgrade pip pyyaml

      # Short-lived token over GitHub OIDC (github-jfrog-public, in
      # ubermold-truefoundry/jfrog/oidc.tf) instead of a stored password.
      - name: Set up JFrog CLI (OIDC)
        id: jfrog
        uses: jfrog/setup-jfrog-cli@76f97e1f8bb39a6bc22052265732581d73325212 # v4.16.0
        env:
          JF_URL: https://tfy.jfrog.io
        with:
          oidc-provider-name: github-jfrog-public
          oidc-audience: jfrog-github

      - name: Log in to JFrog Artifactory
        uses: docker/login-action@v3
        with:
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}
          registry: ${{ env.ARTIFACTORY_REGISTRY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PUBLIC_ECR_IAM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Run sync script
        run: |
          python scripts/sync-images/images_sync.py --file scripts/sync-images/images.yaml