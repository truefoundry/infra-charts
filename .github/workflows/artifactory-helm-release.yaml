# truefoundry and tfy-llm-gateway are released from their OWN
# release/truefoundry-X.Y.Z branch (mirroring helm-charts' branching model;
# the release/ prefix avoids chart-releaser's tag namespace), not from main
# — see release.yaml in this repo for the matching rationale/exclusion.
name: Release Charts to public artifactory

on:
  push:
    branches:
      - main
      - "release/truefoundry-[0-9]*"

env:
  ARTIFACTORY_REGISTRY: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
  ARTIFACTORY_REPOSITORY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_HELM_REGISTRY }}
  INFRAMOLD_ARTIFACTORY_REPOSITORY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_INFRAMOLD_PUBLIC_HELM_REGISTRY }}

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JFrog OIDC token exchange
    steps:
    # Anonymous: infra-charts is public, so the checkout needs no token and works
    # from any IP. A token-authenticated checkout is filtered by the org IP allow
    # list, and ubuntu-latest has no allow-listed address.
    - name: Check out (anonymous)
      run: |
        git init -q .
        git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git fetch -q --no-tags --depth=1 origin "+${GITHUB_SHA}:refs/remotes/origin/ci"
        git checkout -q --detach origin/ci

    - name: Exclude branch-released charts from main
      if: ${{ github.ref == 'refs/heads/main' }}
      run: |
        # main.py scans the working tree, not git history — removing these on
        # disk (this ephemeral checkout is discarded after the job, nothing is
        # pushed) is enough to keep it from ever publishing them off a main push.
        rm -rf charts/truefoundry charts/tfy-llm-gateway

    - name: Set up Helm
      uses: azure/setup-helm@v4.3.0
      with:
        version: v3.17.3

    - name: Add helm dependencies and update
      run: |
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add clickhouse-operator https://docs.altinity.com/clickhouse-operator
        helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
        helm repo add dcgm-exporter https://nvidia.github.io/dcgm-exporter/helm-charts
        helm repo add truefoundry https://truefoundry.github.io/infra-charts
        helm repo add nats https://nats-io.github.io/k8s/helm/charts/
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/
        helm repo add external-secrets https://charts.external-secrets.io
        helm repo add stakater https://stakater.github.io/stakater-charts
        helm repo add tailscale https://pkgs.tailscale.com/helmcharts
        helm repo add vector https://helm.vector.dev
        helm repo update

    # Short-lived JFrog token over GitHub OIDC instead of a stored password.
    # github-jfrog-public issues it as truefoundry-public-write-user (write on
    # tfy-helm) and only for repos in its allowlist, in
    # ubermold-truefoundry/jfrog/oidc.tf. Expires after an hour.
    - name: Set up JFrog CLI (OIDC)
      id: jfrog
      uses: jfrog/setup-jfrog-cli@76f97e1f8bb39a6bc22052265732581d73325212 # v4.16.0
      env:
        JF_URL: https://tfy.jfrog.io
      with:
        oidc-provider-name: github-jfrog-public
        oidc-audience: jfrog-github

    - name: Helm registry login
      env:
        JF_USER: ${{ steps.jfrog.outputs.oidc-user }}
        JF_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
      run: |
        printf '%s' "$JF_TOKEN" | helm registry login "$ARTIFACTORY_REGISTRY" -u "$JF_USER" --password-stdin

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install python dependencies
      run: |
        pip install -r scripts/artifactory-chart-releaser/requirements.txt

    - name: Publish helm charts
      run: |
        python scripts/artifactory-chart-releaser/main.py
        
      