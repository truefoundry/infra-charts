name: Upload Inframold Charts Artifacts

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/upload-artifacts.yml"
      - "charts/tfy-k8s-aws-eks-inframold/**"
      - "charts/tfy-k8s-azure-aks-inframold/**"
      - "charts/tfy-k8s-civo-talos-inframold/**"
      - "charts/tfy-k8s-gcp-gke-standard-inframold/**"
      - "charts/tfy-k8s-generic-inframold/**"
      - "scripts/generate-artifacts-manifest/**"
      - "scripts/upload-artifacts/**"

jobs:
  upload-artifacts:
    strategy:
      fail-fast: false
      matrix:
        chart:
          - tfy-k8s-aws-eks-inframold
          - tfy-k8s-azure-aks-inframold
          - tfy-k8s-gcp-gke-standard-inframold
          - tfy-k8s-generic-inframold
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      ARTIFACTORY_REPOSITORY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      ARTIFACTORY_HELM_REGISTRY_URL: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_HELM_REGISTRY }}
    steps:
      # Anonymous: infra-charts is public, so the checkout needs no token and works
      # from any IP. A token-authenticated checkout is filtered by the org IP allow
      # list, and ubuntu-latest has no allow-listed address.
      - name: Check out (anonymous)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "+${GITHUB_SHA}:refs/remotes/origin/ci"
          git checkout -q --detach origin/ci

      - name: Setup Kubectl
        id: install-kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Setup Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.15.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install python dependencies
        run: |
          pip install -r scripts/upload-artifacts/requirements.txt
          pip install -r scripts/generate-artifacts-manifest/requirements.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Short-lived token over GitHub OIDC (github-jfrog-public, in
      # ubermold-truefoundry/jfrog/oidc.tf) instead of a stored password.
      - name: Set up JFrog CLI (OIDC)
        id: jfrog
        uses: jfrog/setup-jfrog-cli@76f97e1f8bb39a6bc22052265732581d73325212 # v4.16.0
        env:
          JF_URL: https://tfy.jfrog.io
        with:
          oidc-provider-name: github-jfrog-public
          oidc-audience: jfrog-github

      - name: Log in to JFrog Artifactory private
        uses: docker/login-action@v3
        with:
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}
          registry: tfy.jfrog.io

      # Pull-only role: logging in only raises the public ECR pull rate limit.
      # The push role (PUBLIC_ECR_IAM_ROLE_ARN, sync-image.yaml) does not trust
      # this repo's pull_request runs, and must not.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PUBLIC_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1

      # this is to prevent rate limiting errors when pulling base images from public ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Upload Artifacts
        run: |
          chart="${{ matrix.chart }}"
          python scripts/upload-artifacts/upload_artifacts.py \
            helm \
            charts/$chart/artifacts-manifest.json \
            ${{ env.ARTIFACTORY_HELM_REGISTRY_URL }}

          python scripts/upload-artifacts/upload_artifacts.py \
            image \
            charts/$chart/artifacts-manifest.json \
            ${{ env.ARTIFACTORY_REPOSITORY_URL }} \
            --exclude-registries truefoundrycloud
